name: cleanup-old-branches

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Remove merged legacy branches
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

          branches=(
            "chore/safe-merged-branch-cleanup"
            "feature/v0.17.0-ui-cleanup"
            "release-v0.8.0-publish"
            "workstation-v0.5"
          )

          for branch in "${branches[@]}"; do
            if ! git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              echo "Already absent: $branch"
              continue
            fi

            if ! git merge-base --is-ancestor "refs/remotes/origin/$branch" HEAD; then
              echo "Refusing to delete unmerged branch: $branch" >&2
              exit 1
            fi

            git push origin --delete "$branch"
            echo "Deleted merged branch: $branch"
          done
