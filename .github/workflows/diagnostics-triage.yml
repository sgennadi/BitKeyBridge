name: Anonymous diagnostic triage

on:
  issues:
    types: [opened, edited]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: bitkeybridge-diagnostic-analysis
  cancel-in-progress: false

jobs:
  analyze:
    # Issues may be attacker supplied; process only strict typed diagnostic
    # schema and never print raw issue bodies, URLs, usernames or comments.
    if: >-
      github.event_name != 'issues' ||
      startsWith(github.event.issue.title, '[BKB-DIAG/v1] ')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify strict privacy filters
        run: python3 .github/scripts/diagnostic_triage.py --self-test
      - name: Aggregate sanitized error counts and recommend triage
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 .github/scripts/diagnostic_triage.py
          --repo "$GITHUB_REPOSITORY"
          --summary "$GITHUB_STEP_SUMMARY"
          --json-out diagnostics-triage-report.json
      - name: Store safe aggregate analysis
        uses: actions/upload-artifact@v7
        with:
          name: BitKeyBridge-anonymous-diagnostic-triage
          path: diagnostics-triage-report.json
          retention-days: 14
          if-no-files-found: error
