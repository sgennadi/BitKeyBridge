name: finalize-v0.1.0

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/finalize-v0.1.0.yml"

permissions:
  actions: write
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move v0.1.0 to clean release commit and dispatch build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa v0.1.0 ad525d1b71340223c4fe210702fa531e7e67bf4a -m "BitKeyBridge v0.1.0"
          git push --force origin refs/tags/v0.1.0
          gh workflow run build.yml --repo "${GITHUB_REPOSITORY}" --ref v0.1.0
