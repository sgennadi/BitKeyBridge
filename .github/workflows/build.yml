name: build

on:
  push:
    # This temporary RC staging branch publishes only on an explicit final
    # commit, and only after x64/x86/ARM64 and LAPS regression checks pass.
    branches: [ "main", "master", "improve/nonadmin-audit-ui-20261014", "release/v0.30.3", "release/v0.30.4", "release/v0.30.5", "release/v0.32.0", "release/v0.32.1", "release/v0.32.2", "release/v0.32.3", "release/v0.32.4", "release/v0.32.5", "release/v0.33.0", "release/v0.33.1" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

# Compiling untrusted pull request code must never receive write/release
# credentials. Only the explicitly gated release job may publish or attest.
permissions:
  contents: read

concurrency:
  # Bind concurrency to the exact commit. GitHub can deliver rapid PR
  # synchronize events out of order; an older event must never cancel CI for
  # the current PR head.
  group: bitkeybridge-${{ github.workflow }}-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  laps-regression:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # GitHub's Windows 2025 / VS2026 image already ships a .NET 10
      # SDK. Prefer its installed SDK to avoid unnecessary setup-dotnet
      # downloads (transient 409 from dotnetorigin). If the image changes,
      # restore the usual setup-dotnet path rather than silently downgrading.
      - name: Detect preinstalled .NET 10 SDK
        id: sdk_check
        shell: pwsh
        run: |
          $sdks = @()
          if (Get-Command dotnet -ErrorAction SilentlyContinue) {
            $sdks = @(dotnet --list-sdks)
          }
          $available = @($sdks | Where-Object {
            $_ -match '^10\.0\.\d+\s+\['
          }).Count -gt 0
          "available=$($available.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if ($available) { Write-Host 'Using preinstalled .NET 10 SDK.' }
          else { Write-Host '.NET 10 not preinstalled; using setup-dotnet.' }
      - name: Setup .NET 10
        if: steps.sdk_check.outputs.available != 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: LAPS encoding, history and secret lifecycle regression checks
        run: dotnet run --project tests/LapsRegression -c Release

  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-x86, win-arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # GitHub's Windows 2025 / VS2026 image already ships a .NET 10
      # SDK. Prefer its installed SDK to avoid unnecessary setup-dotnet
      # downloads (transient 409 from dotnetorigin). If the image changes,
      # restore the usual setup-dotnet path rather than silently downgrading.
      - name: Detect preinstalled .NET 10 SDK
        id: sdk_check
        shell: pwsh
        run: |
          $sdks = @()
          if (Get-Command dotnet -ErrorAction SilentlyContinue) {
            $sdks = @(dotnet --list-sdks)
          }
          $available = @($sdks | Where-Object {
            $_ -match '^10\.0\.\d+\s+\['
          }).Count -gt 0
          "available=$($available.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if ($available) { Write-Host 'Using preinstalled .NET 10 SDK.' }
          else { Write-Host '.NET 10 not preinstalled; using setup-dotnet.' }
      - name: Setup .NET 10
        if: steps.sdk_check.outputs.available != 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Verify CHANGELOG versions
        shell: pwsh
        run: |
          [xml]$project = Get-Content src\BitKeyBridge\BitKeyBridge.csproj
          $version = @($project.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          if (-not $version) { throw "Project version was not found." }

          $versions = @(
            Get-Content CHANGELOG.md |
              Where-Object { $_ -match '^##\s+\d+\.\d+\.\d+' } |
              ForEach-Object {
                ($_ -replace '^##\s+', '').Trim()
              }
          )

          $currentCount = @($versions | Where-Object { $_ -eq $version }).Count
          if ($currentCount -ne 1) {
            throw "CHANGELOG.md must contain exactly one section for project version $version; found $currentCount."
          }

          $duplicates = @(
            $versions |
              Group-Object |
              Where-Object { $_.Count -gt 1 } |
              Sort-Object Name
          )

          if ($duplicates.Count -gt 0) {
            $duplicates | ForEach-Object {
              Write-Host "Duplicate CHANGELOG version: $($_.Name) ($($_.Count) sections)"
            }
            throw "CHANGELOG.md contains duplicate version headings."
          }

      - name: Reject silent empty catch blocks
        shell: pwsh
        run: |
          $failures = @()
          $files = Get-ChildItem src\BitKeyBridge -Recurse -Filter *.cs -File
          $pattern = 'catch\s*(\([^\)]*\))?\s*\{\s*\}'
          foreach ($file in $files) {
            $raw = Get-Content $file.FullName -Raw
            if ([regex]::IsMatch(
                  $raw,
                  $pattern,
                  [System.Text.RegularExpressions.RegexOptions]::Singleline)) {
              $failures += $file.FullName
            }
          }

          if ($failures) {
            $failures | ForEach-Object { Write-Host $_ }
            throw "Silent empty catch blocks are not allowed. Handle, log, or explicitly report non-fatal failures."
          }

      - name: Reject blocking error MessageBoxes
        shell: pwsh
        run: |
          $uiFiles = Get-ChildItem src\BitKeyBridge\UI -Filter *.cs -File
          $matches = $uiFiles | Select-String -Pattern 'MessageBoxIcon\.Error'
          if ($matches) {
            $matches | ForEach-Object {
              Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())"
            }
            throw "Blocking error MessageBoxes are not allowed. Use UiDiagnosticPanel for errors; reserve modal dialogs for confirmations and user decisions."
          }

      - name: Reject fixed-position WinForms layout
        shell: pwsh
        run: |
          $uiFiles = Get-ChildItem src\BitKeyBridge\UI -Filter *.cs -File
          $matches = $uiFiles | Select-String -Pattern 'SetBounds\s*\(|\bLeft\s*=|\bTop\s*='
          if ($matches) {
            $matches | ForEach-Object {
              Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())"
            }
            throw "Fixed-position WinForms layout is not allowed in src/BitKeyBridge/UI. Use TableLayoutPanel/FlowLayoutPanel/Dock/Anchor instead."
          }

      - name: Verify HiDPI WinForms conventions
        shell: pwsh
        run: |
          $project = Get-Content src\BitKeyBridge\BitKeyBridge.csproj -Raw
          if ($project -notmatch '<ApplicationHighDpiMode>PerMonitorV2</ApplicationHighDpiMode>') {
            throw "ApplicationHighDpiMode must remain PerMonitorV2."
          }

          $dpiBase = Get-Content src\BitKeyBridge\UI\DpiAwareForm.cs -Raw
          if ($dpiBase -notmatch 'AutoScaleMode\s*=\s*AutoScaleMode\.Dpi') {
            throw "DpiAwareForm must use AutoScaleMode.Dpi."
          }

          $uiFiles = Get-ChildItem src\BitKeyBridge\UI -Filter *.cs -File
          $directForms = $uiFiles |
            Where-Object { $_.Name -ne 'DpiAwareForm.cs' } |
            Select-String -Pattern 'class\s+\w+\s*:\s*Form\b'

          if ($directForms) {
            $directForms | ForEach-Object {
              Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())"
            }
            throw "All application forms must inherit DpiAwareForm."
          }

          $forbiddenScale = $uiFiles |
            Select-String -Pattern 'AutoScaleMode\s*=\s*AutoScaleMode\.(None|Font)'

          if ($forbiddenScale) {
            $forbiddenScale | ForEach-Object {
              Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())"
            }
            throw "WinForms UI must use the shared DPI scaling policy."
          }

          $fixedButtonSizes = $uiFiles |
            Select-String -Pattern 'new\s+Button\s*\{[^\r\n]*(Width|Height)\s*='

          if ($fixedButtonSizes) {
            $fixedButtonSizes | ForEach-Object {
              Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())"
            }
            throw "Buttons must use AutoSize/MinimumSize instead of fixed Width/Height."
          }

          $directFontFiles = $uiFiles |
            Where-Object { $_.Name -ne 'UiStyle.cs' }

          $directFontFailures = @()
          foreach ($file in $directFontFiles) {
            $raw = Get-Content $file.FullName -Raw
            if ($raw -match 'new\s+Font\s*\(\s*"(Segoe UI|Consolas)') {
              $directFontFailures += $file.FullName
            }
          }

          if ($directFontFailures) {
            $directFontFailures | ForEach-Object { Write-Host $_ }
            throw "Direct Segoe UI/Consolas construction is not allowed outside UiStyle. Use shared typography tokens."
          }

          $directButtonFiles = $uiFiles |
            Where-Object { $_.Name -ne 'UiStyle.cs' }

          $directButtonFailures = @()
          foreach ($file in $directButtonFiles) {
            $raw = Get-Content $file.FullName -Raw
            if ($raw -match '\bnew\s+Button\b') {
              $directButtonFailures += $file.FullName
            }
          }

          if ($directButtonFailures) {
            $directButtonFailures | ForEach-Object { Write-Host $_ }
            throw "Direct Button construction is not allowed outside UiStyle. Use UiStyle.CreateActionButton or a shared configured field."
          }

          $directListViewColumnFiles = $uiFiles |
            Where-Object { $_.Name -ne 'UiStyle.cs' }

          $directListViewColumnFailures = @()
          foreach ($file in $directListViewColumnFiles) {
            $raw = Get-Content $file.FullName -Raw
            if ($raw -match '\.Columns\.Add\s*\(' -or
                $raw -match '\bnew\s+ColumnHeader\b') {
              $directListViewColumnFailures += $file.FullName
            }
          }

          if ($directListViewColumnFailures) {
            $directListViewColumnFailures | ForEach-Object { Write-Host $_ }
            throw "Direct ListView column construction is not allowed outside UiStyle. Use UiStyle.ConfigureListViewColumns."
          }

      - name: Validate project versions under PowerShell StrictMode
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          [xml]$project = Get-Content src/BitKeyBridge/BitKeyBridge.csproj -Raw
          $versions = @($project.SelectNodes('/Project/PropertyGroup/Version'))
          $informational = @($project.SelectNodes('/Project/PropertyGroup/InformationalVersion'))
          if ($versions.Count -ne 1 -or $informational.Count -ne 1) {
            throw "Expected exactly one Version and InformationalVersion node."
          }
          $version = [string]$versions[0].InnerText.Trim()
          $informationalVersion = [string]$informational[0].InnerText.Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[A-Za-z0-9.-]+)?$' -or
              $version -cne $informationalVersion) {
            throw "Project metadata versions do not match valid SemVer."
          }
          Write-Host "Verified strict-mode project release version: $version"

      - name: Parse-check PowerShell Windows QA scripts
        shell: pwsh
        run: |
          $issues = @()
          foreach ($file in (Get-ChildItem tests/windows -Recurse -Filter *.ps1 -File)) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName, [ref]$tokens, [ref]$parseErrors)
            foreach ($issue in $parseErrors) {
              $issues += "$($file.Name):$($issue.Extent.StartLineNumber): $($issue.Message)"
            }
          }
          if ($issues.Count -ne 0) {
            $issues | ForEach-Object { Write-Host $_ }
            throw "PowerShell QA scripts contain syntax errors."
          }

      - name: Self-test offline UI timing comparator (synthetic numeric data)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $output = & pwsh -NoProfile -File ./tests/windows/Compare-BitKeyBridgeUiPerf.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0 -or $output -notcontains 'UI LATENCY COMPARATOR SELF-TEST OK') {
            throw 'UI timing comparator offline self-test did not pass.'
          }

      - name: Validate GPO templates and localized restriction resources
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: ./tests/windows/Validate-GpoTemplates.ps1

      - name: Reject WinForms recursive repaint regressions at 100-200% DPI
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: ./tests/windows/UiRenderingRegression.ps1

      - name: Restore
        shell: cmd
        run: dotnet restore src\BitKeyBridge\BitKeyBridge.csproj

      - name: Build
        shell: cmd
        run: dotnet build src\BitKeyBridge\BitKeyBridge.csproj -c Release --no-restore

      - name: Publish self-contained single file
        shell: cmd
        run: dotnet publish src\BitKeyBridge\BitKeyBridge.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=true -o artifacts\${{ matrix.rid }}

      - name: Verify supported Windows and PerMonitorV2 in published EXE
        shell: pwsh
        run: |
          ./tests/windows/EmbeddedAppManifestRegression.ps1 -Executable "artifacts/${{ matrix.rid }}/BitKeyBridge.exe"

      # Optional signing is only active if the runner certificate store contains
      # the trusted code-signing certificate AND its private key.
      # Set repository variable BITKEYBRIDGE_SIGNING_THUMBPRINT only after provisioning.
      - name: Optional Authenticode sign and verify
        # Organizational signing credentials are never used on PR or
        # workflow_dispatch: only an explicitly qualified release push.
        if: >-
          vars.BITKEYBRIDGE_SIGNING_THUMBPRINT != '' &&
          github.event_name == 'push' &&
          (
            startsWith(github.ref, 'refs/tags/v') ||
            (
              (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
              startsWith(github.event.head_commit.message, 'Release v')
            ) ||
            (
              github.ref == 'refs/heads/improve/nonadmin-audit-ui-20261014' &&
              startsWith(github.event.head_commit.message, 'Publish RC v0.30.0-rc.1')
            )
          )
        shell: pwsh
        env:
          SIGNING_THUMBPRINT: ${{ vars.BITKEYBRIDGE_SIGNING_THUMBPRINT }}
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Join-Path (Join-Path "artifacts" "${{ matrix.rid }}") "BitKeyBridge.exe"
          $tool = Get-Command signtool.exe -ErrorAction SilentlyContinue
          if (-not $tool) {
            $candidate = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -like "*\x64\signtool.exe" } |
              Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $candidate) { throw "SignTool not found. Install Windows SDK on signing runner." }
            $signToolPath = $candidate.FullName
          } else { $signToolPath = $tool.Source }
          if (-not (Test-Path $exe)) { throw "Published executable not found." }
          & $signToolPath sign /sha1 $env:SIGNING_THUMBPRINT /fd SHA256 /tr "http://timestamp.digicert.com" /td SHA256 "$exe"
          if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed." }
          & $signToolPath verify /pa /all /v "$exe"
          if ($LASTEXITCODE -ne 0) { throw "Authenticode validation failed." }
          Write-Host "Signed executable verified. SHA256SUMS are created after packaging."

      - name: Offline self-test (supported Windows Server architecture)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $exe = "artifacts\${{ matrix.rid }}\BitKeyBridge.exe"
          $report = "artifacts\${{ matrix.rid }}\self-test.log"
          $process = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          if (Test-Path $report) {
            Get-Content $report
          }
          if ($process.ExitCode -ne 0) {
            throw "Offline self-test failed with exit code $($process.ExitCode)."
          }

      - name: Runtime UI layout self-test
        if: matrix.rid == 'win-x64'
        shell: pwsh
        env:
          # Offline synthetic data only. Never record the live user's GUI.
          BITKEYBRIDGE_SYNTHETIC_UI_SNAPSHOTS: '1'
        run: |
          $exe = "artifacts\${{ matrix.rid }}\BitKeyBridge.exe"
          $report = "artifacts\${{ matrix.rid }}\ui-self-test.log"
          $process = Start-Process -FilePath $exe -ArgumentList "--ui-self-test" -Wait -PassThru
          if (Test-Path $report) {
            Get-Content $report
          }
          if ($process.ExitCode -ne 0) {
            throw "Runtime UI layout self-test failed with exit code $($process.ExitCode)."
          }

      - name: Upload synthetic 1080p Start UI QA snapshots
        if: always() && matrix.rid == 'win-x64'
        uses: actions/upload-artifact@v7
        with:
          name: BitKeyBridge-Start-1080p-QA-SYNTHETIC
          path: artifacts/win-x64/ui-start-1080p-*.png
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30

      # Basic JSON contract smoke on a CI runner. The broker integration job
      # separately launches this mode under TWO genuine non-admin accounts.
      - name: Startup diagnostics JSON smoke
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $exe = "artifacts\${{ matrix.rid }}\BitKeyBridge.exe"
          $output = & $exe --startup-diagnostics --no-elevation 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) {
            throw "Startup diagnostics failed with exit code $LASTEXITCODE."
          }
          $report = $output | ConvertFrom-Json
          if ($report.Mode -ne "NonElevatingStartupDiagnostics" -or
              -not $report.Checks -or
              -not $report.ProcessArchitecture) {
            throw "Startup diagnostics did not return the expected secret-free JSON report."
          }
          Write-Host "Non-elevating startup diagnostics: $($report.Checks.Count) checks."

      # Portable executables, including privileged CI runners, must never
      # register a high-privilege scheduler task or run unattended installs.
      - name: Background updater portable denial
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $exe = "artifacts\${{ matrix.rid }}\BitKeyBridge.exe"
          # Native stderr from an expected denial must not be turned into
          # a PowerShell terminating error by the GitHub Actions runner.
          $background = Start-Process -FilePath $exe -ArgumentList @(
            '--scheduled-update', '--no-elevation'
          ) -PassThru -Wait
          if ($background.ExitCode -eq 0) {
            throw "SECURITY: portable copy was permitted to run the SYSTEM background updater."
          }

          $register = Start-Process -FilePath $exe -ArgumentList @(
            '--update-task-install', '--no-elevation'
          ) -PassThru -Wait
          if ($register.ExitCode -eq 0) {
            throw "SECURITY: portable copy registered a persistent SYSTEM update task."
          }
          Write-Host "Portable background update denied with $($background.ExitCode) and task creation denied with $($register.ExitCode)."

      - name: Fleet secret-free JSON schema smoke
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $exe = "artifacts\${{ matrix.rid }}\BitKeyBridge.exe"
          $json = & $exe --fleet-status --no-elevation 2>&1 | Out-String
          if ($LASTEXITCODE -notin @(0, 2)) {
            throw "Fleet metadata command crashed: $json"
          }
          $report = $json | ConvertFrom-Json
          if ($report.schemaVersion -ne 1 -or
              !$report.machine -or !$report.version -or
              $report.dataClassification -ne 'NonSecretMetadataOnly' -or
              $null -eq $report.autoInstallPermitted) {
            throw 'Fleet JSON schema mismatch.'
          }
          foreach ($name in @('password','recoveryKey','accessToken','tenantId','privateKey')) {
            if ($json -match ('"'+$name+'"s*:')) {
              throw "Forbidden sensitive field in fleet JSON: $name"
            }
          }

      - name: Fleet atomic export and CSV roundtrip
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # A deliberately rejected CLI operation must be inspected via $LASTEXITCODE.
          $PSNativeCommandUseErrorActionPreference = $false
          $exe = "artifacts\${{ matrix.rid }}\BitKeyBridge.exe"
          $folder = Join-Path $env:RUNNER_TEMP ('bkb-fleet-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $folder | Out-Null
          try {
            $machine = [Environment]::MachineName
            $target = Join-Path $folder ($machine + '.json')
            & $exe --fleet-export $target --no-elevation | Out-Null
            $status = $LASTEXITCODE
            Write-Host "Fleet export exit code: $status; JSON present: $(Test-Path -LiteralPath $target -PathType Leaf)"
            if ($status -notin @(0, 2) -or -not (Test-Path -LiteralPath $target -PathType Leaf)) {
              throw 'Native fleet export did not write a machine-scoped JSON report.'
            }
            $raw = Get-Content -LiteralPath $target -Raw -Encoding UTF8
            $report = $raw | ConvertFrom-Json
            if ($report.machine -ne $machine -or $report.schemaVersion -ne 1 -or
                $report.dataClassification -ne 'NonSecretMetadataOnly') {
              throw 'Fleet export wrote a mismatched or unsafe inventory schema.'
            }
            $csv = Join-Path $folder 'fleet.csv'
            & $exe --fleet-aggregate $folder $csv --no-elevation | Out-Null
            $aggregateExit = $LASTEXITCODE
            Write-Host "Fleet aggregation exit code: $aggregateExit; CSV present: $(Test-Path -LiteralPath $csv -PathType Leaf)"
            if ($aggregateExit -ne 0 -or -not (Test-Path -LiteralPath $csv -PathType Leaf)) {
              throw 'Fleet roundtrip aggregation failed.'
            }
            $rows = @(Get-Content -LiteralPath $csv -Encoding UTF8)
            if ($rows.Count -ne 2 -or $rows[0] -notmatch '^Machine,CollectedUtc,' -or
                $rows[1] -notmatch [regex]::Escape($machine)) {
              throw 'Fleet aggregate CSV does not include exactly one device.'
            }
            $denied = Join-Path $folder 'OTHER-COMPUTER.json'
            & $exe --fleet-export $denied --no-elevation 2>&1 | Out-Null
            $deniedExit = $LASTEXITCODE
            Write-Host "Wrong-machine export exit code: $deniedExit; output absent: $(!(Test-Path -LiteralPath $denied))"
            if ($deniedExit -eq 0 -or (Test-Path -LiteralPath $denied)) {
              throw 'Fleet export allowed overwriting another computer identity.'
            }
          }
          finally {
            Remove-Item -LiteralPath $folder -Recurse -Force -ErrorAction SilentlyContinue
          }
          # The final native invocation intentionally returned 2 (denied).
          # Explicitly report success after assertions: pwsh otherwise returns
          # the last native exit code even when every safety assertion passed.
          exit 0

      - name: Updater preference persistence self-test
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $exe = "artifacts\${{ matrix.rid }}\BitKeyBridge.exe"

          $disableOutput = & $exe --update-checks-disable --no-elevation 2>&1 | Out-String
          $disableExit = $LASTEXITCODE
          Write-Host $disableOutput
          if ($disableExit -ne 0) {
            throw "--update-checks-disable failed with exit code $disableExit."
          }

          $disabledStatus = & $exe --update-checks-status --no-elevation 2>&1 | Out-String
          $disabledExit = $LASTEXITCODE
          Write-Host $disabledStatus
          if ($disabledExit -ne 0 -or $disabledStatus -notmatch 'AutomaticChecks=False') {
            throw "Automatic update checks were not persisted as disabled."
          }

          $enableOutput = & $exe --update-checks-enable --no-elevation 2>&1 | Out-String
          $enableExit = $LASTEXITCODE
          Write-Host $enableOutput
          if ($enableExit -ne 0) {
            throw "--update-checks-enable failed with exit code $enableExit."
          }

          $enabledStatus = & $exe --update-checks-status --no-elevation 2>&1 | Out-String
          $enabledExit = $LASTEXITCODE
          Write-Host $enabledStatus
          if ($enabledExit -ne 0 -or $enabledStatus -notmatch 'AutomaticChecks=True') {
            throw "Automatic update checks were not persisted as enabled."
          }

          $autoDisableOutput = & $exe --auto-update-disable --no-elevation 2>&1 | Out-String
          $autoDisableExit = $LASTEXITCODE
          Write-Host $autoDisableOutput
          if ($autoDisableExit -ne 0) {
            throw "--auto-update-disable failed with exit code $autoDisableExit."
          }

          $autoDisabledStatus = & $exe --auto-update-status --no-elevation 2>&1 | Out-String
          $autoDisabledExit = $LASTEXITCODE
          Write-Host $autoDisabledStatus
          if ($autoDisabledExit -ne 0 -or $autoDisabledStatus -notmatch 'AutomaticInstall=False') {
            throw "Automatic update installation was not persisted as disabled."
          }

          $deniedOutput = & $exe --auto-update-enable --no-elevation 2>&1 | Out-String
          if ($LASTEXITCODE -eq 0) {
            throw "Unsigned auto-install incorrectly accepted without explicit consent."
          }
          $autoEnableOutput = & $exe --auto-update-enable --accept-unsigned-update-risk --no-elevation 2>&1 | Out-String
          $autoEnableExit = $LASTEXITCODE
          Write-Host $autoEnableOutput
          if ($autoEnableExit -ne 0) {
            throw "Explicit unsigned auto-install enable failed ($autoEnableExit)."
          }

          $autoEnabledStatus = & $exe --auto-update-status --no-elevation 2>&1 | Out-String
          $autoEnabledExit = $LASTEXITCODE
          Write-Host $autoEnabledStatus
          if ($autoEnabledExit -ne 0 -or
              $autoEnabledStatus -notmatch 'AutomaticInstall=True' -or
              $autoEnabledStatus -notmatch 'AutomaticChecks=True' -or
              $autoEnabledStatus -notmatch 'UnsignedConsent=True' -or
              $autoEnabledStatus -notmatch 'Unsigned opt-in') {
            throw "Automatic update installation was not persisted as enabled."
          }

      # Only register/query/remove: NEVER run a SYSTEM scheduled update in CI.
      # A fresh GitHub-hosted Windows runner is disposable. The test schedules
      # 12 hours ahead and tears down its task in finally, even on failure.
      - name: Task Scheduler registration and SYSTEM identity smoke (no task run)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installedDir = Join-Path $env:ProgramFiles 'BitKeyBridge'
          $installedExe = Join-Path $installedDir 'BitKeyBridge.exe'
          $sourceExe = Join-Path (Get-Location) 'artifacts\win-x64\BitKeyBridge.exe'
          # Never touch a pre-existing installation folder. This smoke test
          # runs only on ephemeral hosted Windows; it owns the folder it creates.
          if (Test-Path -LiteralPath $installedDir) {
            throw 'An existing Program Files directory cannot be replaced during CI.'
          }
          $taskName = 'BitKeyBridge-AutoUpdate'
          & schtasks.exe /Query /TN $taskName *> $null
          if ($LASTEXITCODE -eq 0) {
            throw 'An existing updater task cannot be replaced during CI.'
          }
          $created = $false
          $createdDirectory = $false
          try {
            New-Item -ItemType Directory -Path $installedDir -ErrorAction Stop | Out-Null
            $createdDirectory = $true
            Copy-Item -LiteralPath $sourceExe -Destination $installedExe -Force
            $hour = (Get-Date).AddHours(12).Hour
            $output = & $installedExe --update-task-install --update-task-hour $hour --no-elevation 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) {
              throw "Task registration failed: $output"
            }
            $created = $true
            $status = & $installedExe --update-task-status --no-elevation 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) {
              throw "Registered task is not queryable: $status"
            }
            [xml]$xml = (& schtasks.exe /Query /TN $taskName /XML | Out-String)
            if ($LASTEXITCODE -ne 0) { throw 'Task XML query failed.' }
            $command = [string]$xml.SelectSingleNode("//*[local-name()='Exec']/*[local-name()='Command']").InnerText
            # SchTasks stores a quoted Command when the Program Files path
            # contains spaces. Require exactly that quoted absolute path.
            $expectedCommand = '"' + $installedExe + '"'
            $arguments = [string]$xml.SelectSingleNode("//*[local-name()='Exec']/*[local-name()='Arguments']").InnerText
            $userId = [string]$xml.SelectSingleNode("//*[local-name()='Principal']/*[local-name()='UserId']").InnerText
            if ($command -ine $expectedCommand -or
                $arguments -cne '--scheduled-update --no-elevation' -or
                $userId -notin @('S-1-5-18', 'SYSTEM', 'NT AUTHORITY\SYSTEM')) {
              throw "Unexpected task action or principal; command=$command, arguments=$arguments, user=$userId"
            }
            # Even an elevated human administrator must NOT run the
            # background updater, which is restricted to LocalSystem.
            $denied = & $installedExe --scheduled-update --no-elevation 2>&1 | Out-String
            if ($LASTEXITCODE -eq 0) {
              throw 'Background update accepted a non-SYSTEM administrator token.'
            }
            Write-Host 'Daily SYSTEM task action, principal, registration and denial passed.'
          }
          finally {
            if ($created) {
              $removed = & $installedExe --update-task-remove --no-elevation 2>&1 | Out-String
              if ($LASTEXITCODE -ne 0) {
                Write-Host "WARNING: task removal failed: $removed"
                & schtasks.exe /Delete /F /TN $taskName
              }
            }
            if ($createdDirectory) {
              # PowerShell 7 Remove-Item intermittently threw NullReference
              # when deleting a newly emptied Program Files directory on a
              # hosted runner, masking an otherwise successful SYSTEM smoke.
              # Delete only our exact file and only an EMPTY owned directory;
              # an unexpected file or access failure must still fail the job.
              if ([System.IO.File]::Exists($installedExe)) {
                [System.IO.File]::Delete($installedExe)
              }
              if ([System.IO.Directory]::Exists($installedDir)) {
                [System.IO.Directory]::Delete($installedDir, $false)
              }
            }
          }

      - name: Guard release workflow ordering and branch safety
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          ./tests/windows/ReleaseWorkflowSafety.ps1

      - name: Regression - reject invalid or unauthorized release signing
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          ./tests/windows/ReleaseSigningGateSmoke.ps1 -Executable "artifacts/win-x64/BitKeyBridge.exe"

      - name: Package architecture (exact executable only)
        shell: pwsh
        run: |
          $exe = "artifacts/${{ matrix.rid }}/BitKeyBridge.exe"
          $zip = "artifacts/BitKeyBridge-${{ matrix.rid }}.zip"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'Missing published executable.' }
          if (Test-Path -LiteralPath $zip) { Remove-Item -LiteralPath $zip -Force }
          Compress-Archive -LiteralPath $exe -DestinationPath $zip -CompressionLevel Optimal
          ./tests/windows/Verify-UpdateZipLayout.ps1 -ArchivePath $zip -ExpectedExecutable $exe
          ./tests/windows/UpdateZipLayoutRegression.ps1

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: BitKeyBridge-${{ matrix.rid }}
          path: artifacts/BitKeyBridge-${{ matrix.rid }}.zip
          if-no-files-found: error

  # v0.34 Preview's integration jobs are restricted to PR #110 by both
  # exact source branch name and pull request number. They run on ephemeral
  # hosted Windows with synthetic data; neither publish nor sign releases.
  legacy-upgrade-regression:
    # Only run on disposable hosted Windows. Exercises the ACTUAL elevated
    # apply/rollback implementation with synthetic config and DPAPI fixtures.
    if: >-
      (github.event_name == 'pull_request' &&
       (github.head_ref == 'feature/v0.30.4-reliability-20261017' ||
        github.head_ref == 'hotfix/v0.30.5-zip-compat-20261018' ||
         (github.head_ref == 'feature/v0.34.0-localization-and-ui-speed' &&
          github.event.pull_request.number == 110))) ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/release/v0.30.4' ||
        github.ref == 'refs/heads/release/v0.30.5' ||
        github.ref == 'refs/heads/release/v0.32.0' ||
        github.ref == 'refs/heads/release/v0.32.1' ||
        github.ref == 'refs/heads/release/v0.32.2' ||
        github.ref == 'refs/heads/release/v0.32.3' ||
        github.ref == 'refs/heads/release/v0.32.4' ||
         github.ref == 'refs/heads/release/v0.32.5' ||
         github.ref == 'refs/heads/release/v0.33.0' ||
         github.ref == 'refs/heads/release/v0.33.1'))
    needs: [build]
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout regression harness
        uses: actions/checkout@v7

      - name: Download compiled candidate
        uses: actions/download-artifact@v8
        with:
          name: BitKeyBridge-win-x64
          path: upgrade-candidate

      - name: Verify upgrades and rollbacks from v0.30.1 and v0.30.3
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') {
            throw 'Legacy upgrades must only run on a disposable hosted Windows runner.'
          }
          ./tests/windows/UpgradeMigrationRegression.ps1 -CandidateZip 'upgrade-candidate/BitKeyBridge-win-x64.zip' -EphemeralHostedRunner

  audit-broker-integration:
    # Must run only on GitHub-hosted ephemeral Windows. This isolated test
    # creates temporary local accounts, installs an SCM service and adjusts
    # ProgramData ACLs; it must never run on a persistent/self-hosted machine.
    if: >-
      (github.event_name == 'pull_request' &&
       (github.head_ref == 'feature/protected-audit-broker-20261014' ||
        github.head_ref == 'integration/v0.30.2-audit-broker-updater-20261016' ||
        github.head_ref == 'feature/v0.30.3-helpdesk-ux-20261016' ||
        github.head_ref == 'feature/v0.30.4-tab-order-updater-20261017' ||
         github.head_ref == 'feature/v0.30.4-reliability-20261017' ||
         github.head_ref == 'hotfix/v0.30.5-zip-compat-20261018' ||
         (github.head_ref == 'feature/v0.34.0-localization-and-ui-speed' &&
          github.event.pull_request.number == 110))) ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/release/v0.30.3' ||
        github.ref == 'refs/heads/release/v0.30.4' ||
        github.ref == 'refs/heads/release/v0.30.5' ||
        github.ref == 'refs/heads/release/v0.32.0' ||
        github.ref == 'refs/heads/release/v0.32.1' ||
        github.ref == 'refs/heads/release/v0.32.2' ||
        github.ref == 'refs/heads/release/v0.32.3' ||
        github.ref == 'refs/heads/release/v0.32.4' ||
         github.ref == 'refs/heads/release/v0.32.5' ||
         github.ref == 'refs/heads/release/v0.33.0' ||
         github.ref == 'refs/heads/release/v0.33.1'))
    needs: [build]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout integration harness
        uses: actions/checkout@v7

      - name: Download tested x64 executable package
        uses: actions/download-artifact@v8
        with:
          name: BitKeyBridge-win-x64
          path: broker-integration

      - name: Verify strict audit with two genuine standard Windows tokens
        shell: pwsh
        run: |
          if ($env:GITHUB_ACTIONS -ne 'true' -or
              $env:RUNNER_ENVIRONMENT -ne 'github-hosted') {
            throw 'Protected audit integration must use an ephemeral GitHub-hosted Windows runner.'
          }
          $root = Join-Path $env:RUNNER_TEMP 'bkb-broker-integration'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          Expand-Archive -Path broker-integration/BitKeyBridge-win-x64.zip -DestinationPath $root -Force
          ./tests/windows/ProtectedAuditBrokerIntegration.ps1 `
            -Executable (Join-Path $root 'BitKeyBridge.exe') `
            -EphemeralHostedRunner

  release-signing-positive:
    # Ephemeral PKI tests are not an organization signing approval.
    # Sign COPIES of all 3 tested architectures with a temporary certificate
    # trusted only in CurrentUser on a disposable GitHub-hosted Windows runner.
    # Use 2022 deliberately: the 2025/VS2026 hosted image blocks indefinitely
    # in certutil CurrentUser Root enrollment even with a bounded child process.
    # Never upload the signed test binaries, certificate or private key.
    if: >-
      github.event_name == 'pull_request' &&
      (github.head_ref == 'feature/protected-audit-broker-20261014' ||
       github.head_ref == 'integration/v0.30.2-audit-broker-updater-20261016' ||
       github.head_ref == 'feature/v0.30.3-helpdesk-ux-20261016' ||
       (github.head_ref == 'feature/v0.34.0-localization-and-ui-speed' &&
        github.event.pull_request.number == 110))
    needs: [build]
    runs-on: windows-2022
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout signing verification harness
        uses: actions/checkout@v7

      - name: Download verified x64 architecture
        uses: actions/download-artifact@v8
        with:
          name: BitKeyBridge-win-x64
          path: signing-integration/win-x64

      - name: Download verified x86 architecture
        uses: actions/download-artifact@v8
        with:
          name: BitKeyBridge-win-x86
          path: signing-integration/win-x86

      - name: Download verified ARM64 architecture
        uses: actions/download-artifact@v8
        with:
          name: BitKeyBridge-win-arm64
          path: signing-integration/win-arm64

      - name: Positive signed release and tamper rejection (ephemeral cert)
        shell: pwsh
        run: |
          if ($env:GITHUB_ACTIONS -ne 'true' -or
              $env:RUNNER_ENVIRONMENT -ne 'github-hosted') {
            throw 'Signature integration is allowed only on an ephemeral GitHub-hosted runner.'
          }
          ./tests/windows/ReleaseSigningPositiveIntegration.ps1 -ArtifactRoot signing-integration -EphemeralHostedRunner

  test-bundle:
    # One-click QA download only after EVERY required broker and signer test
    # passes. Never attach unsigned developer binaries to GitHub Releases.
    if: >-
      github.event_name == 'pull_request' &&
      (github.head_ref == 'feature/protected-audit-broker-20261014' || github.head_ref == 'integration/v0.30.2-audit-broker-updater-20261016' || github.head_ref == 'feature/v0.30.3-helpdesk-ux-20261016')
    needs: [build, laps-regression, audit-broker-integration, release-signing-positive]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout QA instructions
        uses: actions/checkout@v7

      - name: Download x64 test binary
        uses: actions/download-artifact@v8
        with:
          name: BitKeyBridge-win-x64
          path: test-bundle

      - name: Download x86 test binary
        uses: actions/download-artifact@v8
        with:
          name: BitKeyBridge-win-x86
          path: test-bundle

      - name: Download ARM64 test binary
        uses: actions/download-artifact@v8
        with:
          name: BitKeyBridge-win-arm64
          path: test-bundle

      - name: Generate checksums and isolated-QA instructions
        shell: bash
        run: |
          set -euo pipefail
          cp tests/windows/BitKeyBridge-DomainPreflight.cmd test-bundle/
          cd test-bundle
          for rid in win-x64 win-x86 win-arm64; do
            test -s "BitKeyBridge-${rid}.zip"
          done
          sha256sum BitKeyBridge-win-x64.zip BitKeyBridge-win-x86.zip BitKeyBridge-win-arm64.zip > SHA256SUMS.txt
          printf 'Git commit: %s\nVersion: 0.30.3-rc.1 (TEST ONLY)\n' "${GITHUB_SHA}" > BUILD-INFO.txt
          cat > README-TEST.txt <<'EOF'
          BitKeyBridge 0.30.3-rc.1 -- UNSIGNED QA TEST BUNDLE
          ==================================================
          This archive is NOT a production release and NOT organization-signed.
          Do not install on a domain controller or production Helpdesk workstation.
          Do not distribute through Intune, GPO or automatic updates.

          Files:
          - BitKeyBridge-win-x64.zip   Windows x64
          - BitKeyBridge-win-x86.zip   Windows x86
          - BitKeyBridge-win-arm64.zip Windows ARM64
          - SHA256SUMS.txt             SHA-256 checksums for all three ZIPs
          - BUILD-INFO.txt             Source commit and test version
          - BitKeyBridge-DomainPreflight.cmd  Optional read-only QA report

          Verify ZIP hashes against SHA256SUMS.txt. Extract ONLY the ZIP
          matching your Windows architecture on a disposable test workstation.
          From an ordinary, non-elevated CMD inside the EXE directory run:

              BitKeyBridge.exe --version
              BitKeyBridge.exe --startup-diagnostics --no-elevation
              BitKeyBridge.exe --self-test --no-elevation
              BitKeyBridge.exe --audit-broker-preflight --no-elevation

          Run the optional CMD report wrapper with the EXE absolute path:
              BitKeyBridge-DomainPreflight.cmd "C:\QA\BitKeyBridge.exe"

          To intentionally write one synthetic broker health event only:
              BitKeyBridge.exe --audit-broker-preflight --probe --no-elevation

          Real domain/Entra recovery, trusted signing, SIEM and rollback
          require separate controlled acceptance. See repository docs:
          docs/managed-domain-acceptance-0.30.0-rc.2.md

          DO NOT MERGE/PUBLISH WITHOUT MANAGED-DOMAIN ACCEPTANCE.
          EOF

      - name: Publish one-click unsigned QA bundle (Actions only)
        uses: actions/upload-artifact@v7
        with:
          name: BitKeyBridge-v0.30.3-rc.1-TEST-BUNDLE-UNSIGNED
          path: test-bundle/
          if-no-files-found: error
          retention-days: 90

  preview-qa-bundle:
    # Manual EN/RU/HE and RDP QA ONLY; no signed release, release tag,
    # deployment, updater activation, credentials or signing keys.
    # Package only after every ephemeral integration gate is green.
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'feature/v0.34.0-localization-and-ui-speed' &&
      github.event.pull_request.number == 110
    needs: [build, laps-regression, legacy-upgrade-regression, audit-broker-integration, release-signing-positive]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout exact QA source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download tested x64 preview
        uses: actions/download-artifact@v8
        with:
          name: BitKeyBridge-win-x64
          path: preview-qa

      - name: Download tested x86 preview
        uses: actions/download-artifact@v8
        with:
          name: BitKeyBridge-win-x86
          path: preview-qa

      - name: Download tested ARM64 preview
        uses: actions/download-artifact@v8
        with:
          name: BitKeyBridge-win-arm64
          path: preview-qa

      - name: Verify artifact structure and pin SHA-256 checksums
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "pull_request"
          test "$GITHUB_HEAD_REF" = "feature/v0.34.0-localization-and-ui-speed"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$PR_HEAD_SHA" != ""
          version=$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('src/BitKeyBridge/BitKeyBridge.csproj').getroot()
          versions = [node.text.strip() for node in root.findall('./PropertyGroup/Version') if node.text]
          if len(versions) != 1:
              raise SystemExit('Exactly one project Version node required')
          print(versions[0])
          PY
          )
          [[ "$version" =~ ^0[.]34[.]0-preview[.][0-9]+$ ]] || {
            echo 'This QA workflow is restricted to v0.34 preview builds.'
            exit 1
          }
          for rid in win-x64 win-x86 win-arm64; do
            zip="preview-qa/BitKeyBridge-$rid.zip"
            test -s "$zip"
            entries="$(unzip -Z1 "$zip")"
            test "$entries" = 'BitKeyBridge.exe' || {
              echo "Unexpected ZIP structure: $rid"
              exit 1
            }
          done
          cp tests/windows/BitKeyBridge-DomainPreflight.cmd preview-qa/
          cp tests/windows/Compare-BitKeyBridgeUiPerf.ps1 preview-qa/
          (
            cd preview-qa
            sha256sum BitKeyBridge-win-x64.zip BitKeyBridge-win-x86.zip BitKeyBridge-win-arm64.zip \
              BitKeyBridge-DomainPreflight.cmd Compare-BitKeyBridgeUiPerf.ps1 > SHA256SUMS.txt
            printf 'QA preview version: %s\nPR: #110\nHead SHA: %s\nVerified merge source SHA: %s\nUnsigned QA artifact only\n' \
              "$version" "$PR_HEAD_SHA" "$GITHUB_SHA" > BUILD-INFO.txt
            cat > README-TEST.txt <<'EOF'
          BITKEYBRIDGE 0.34 — UNSIGNED DEVELOPMENT QA
          ============================================
          These files are NOT an organization-signed production release.
          Never auto-deploy or install through GPO, Intune or a scheduled update.
          Do not run on a domain controller or production helpdesk machine.

          Verify SHA256SUMS.txt before extracting the archive for your CPU.
          Use a disposable Windows test machine or isolated RDP session.
          The EXE is a portable single-file app; do not replace a production EXE.

          From a regular (non-elevated) CMD in the extracted folder:
              BitKeyBridge.exe --version
              BitKeyBridge.exe --self-test --no-elevation
              BitKeyBridge.exe --ui-self-test --no-elevation
              BitKeyBridge.exe --audit-broker-preflight --no-elevation

          Open the application manually. Cycle EN > RU > HE > RU > EN
          at 100%, 150%, 175% and 200% Windows scaling; also test RDP.
          Verify no empty controls, clipped Hebrew/Russian labels or vanished
          Copy diagnostics action. Check the selected device remains unchanged.
          Run UI performance diagnostics (Ctrl+Shift+P) in v0.33.1 and
          the matching v0.34 preview on the SAME hardware, session and DPI.
          Copy the reports into stable-ui.txt and preview-ui.txt respectively.
          From a regular PowerShell console in this QA folder, run:
              powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\Compare-BitKeyBridgeUiPerf.ps1 -BaselinePath .\stable-ui.txt -PreviewPath .\preview-ui.txt -MinimumSamples 5 -OutputCsv .\ui-comparison.csv
          Only known numeric fields appear in the comparison CSV. The stable
          0.33.1 report lacks language p95; the tool marks this N/A instead
          of inventing or comparing unsupported percentiles. Negative
          percentages mean lower latency. Do not compare different DPI or
          local-vs-RDP sessions. Neither tool measures OS paint/RDP transport.

          Do not paste secret-bearing data into bug reports. Use only the
          sanitized UI-performance report, never raw keys or authentication.
          Organization signing, managed-domain standard-user acceptance,
          updater canary and rollback approval are separate release gates.
          EOF
          )

      - name: Upload source-pinned unsigned manual QA bundle (Actions only)
        uses: actions/upload-artifact@v7
        with:
          name: BitKeyBridge-v0.34-Preview-QA-UNSIGNED
          path: preview-qa/
          if-no-files-found: error
          retention-days: 30

