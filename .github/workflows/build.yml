name: build

on:
  push:
    # This temporary RC staging branch publishes only on an explicit final
    # commit, and only after x64/x86/ARM64 and LAPS regression checks pass.
    branches: [ "main", "master", "improve/nonadmin-audit-ui-20261014" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

# PR jobs are read-only. Only the release job can publish.
permissions:
  contents: read

concurrency:
  # Bind concurrency to the exact commit. GitHub can deliver rapid PR
  # synchronize events out of order; an older event must never cancel CI for
  # the current PR head.
  group: bitkeybridge-${{ github.workflow }}-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  laps-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: LAPS encoding, history and secret lifecycle regression checks
        run: dotnet run --project tests/LapsRegression -c Release

  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-x86, win-arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Verify CHANGELOG versions
        shell: pwsh
        run: |
          [xml]$project = Get-Content src\BitKeyBridge\BitKeyBridge.csproj
          $version = @($project.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          if (-not $version) { throw "Project version was not found." }

          $versions = @(
            Get-Content CHANGELOG.md |
              Where-Object { $_ -match '^##\s+\d+\.\d+\.\d+' } |
              ForEach-Object {
                ($_ -replace '^##\s+', '').Trim()
              }
          )

          $currentCount = @($versions | Where-Object { $_ -eq $version }).Count
          if ($currentCount -ne 1) {
            throw "CHANGELOG.md must contain exactly one section for project version $version; found $currentCount."
          }

          $duplicates = @(
            $versions |
              Group-Object |
              Where-Object { $_.Count -gt 1 } |
              Sort-Object Name
          )

          if ($duplicates.Count -gt 0) {
            $duplicates | ForEach-Object {
              Write-Host "Duplicate CHANGELOG version: $($_.Name) ($($_.Count) sections)"
            }
            throw "CHANGELOG.md contains duplicate version headings."
          }

      - name: Verify stable 0.30 release safety invariants
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: ./tests/windows/StableReleaseWorkflowSafety.ps1

      - name: Reject silent empty catch blocks
        shell: pwsh
        run: |
          $failures = @()
          $files = Get-ChildItem src\BitKeyBridge -Recurse -Filter *.cs -File
          $pattern = 'catch\s*(\([^\)]*\))?\s*\{\s*\}'
          foreach ($file in $files) {
            $raw = Get-Content $file.FullName -Raw
            if ([regex]::IsMatch(
                  $raw,
                  $pattern,
                  [System.Text.RegularExpressions.RegexOptions]::Singleline)) {
              $failures += $file.FullName
            }
          }

          if ($failures) {
            $failures | ForEach-Object { Write-Host $_ }
            throw "Silent empty catch blocks are not allowed. Handle, log, or explicitly report non-fatal failures."
          }

      - name: Reject blocking error MessageBoxes
        shell: pwsh
        run: |
          $uiFiles = Get-ChildItem src\BitKeyBridge\UI -Filter *.cs -File
          $matches = $uiFiles | Select-String -Pattern 'MessageBoxIcon\.Error'
          if ($matches) {
            $matches | ForEach-Object {
              Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())"
            }
            throw "Blocking error MessageBoxes are not allowed. Use UiDiagnosticPanel for errors; reserve modal dialogs for confirmations and user decisions."
          }

      - name: Reject fixed-position WinForms layout
        shell: pwsh
        run: |
          $uiFiles = Get-ChildItem src\BitKeyBridge\UI -Filter *.cs -File
          $matches = $uiFiles | Select-String -Pattern 'SetBounds\s*\(|\bLeft\s*=|\bTop\s*='
          if ($matches) {
            $matches | ForEach-Object {
              Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())"
            }
            throw "Fixed-position WinForms layout is not allowed in src/BitKeyBridge/UI. Use TableLayoutPanel/FlowLayoutPanel/Dock/Anchor instead."
          }

      - name: Verify HiDPI WinForms conventions
        shell: pwsh
        run: |
          $project = Get-Content src\BitKeyBridge\BitKeyBridge.csproj -Raw
          if ($project -notmatch '<ApplicationHighDpiMode>PerMonitorV2</ApplicationHighDpiMode>') {
            throw "ApplicationHighDpiMode must remain PerMonitorV2."
          }

          $dpiBase = Get-Content src\BitKeyBridge\UI\DpiAwareForm.cs -Raw
          if ($dpiBase -notmatch 'AutoScaleMode\s*=\s*AutoScaleMode\.Dpi') {
            throw "DpiAwareForm must use AutoScaleMode.Dpi."
          }

          $uiFiles = Get-ChildItem src\BitKeyBridge\UI -Filter *.cs -File
          $directForms = $uiFiles |
            Where-Object { $_.Name -ne 'DpiAwareForm.cs' } |
            Select-String -Pattern 'class\s+\w+\s*:\s*Form\b'

          if ($directForms) {
            $directForms | ForEach-Object {
              Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())"
            }
            throw "All application forms must inherit DpiAwareForm."
          }

          $forbiddenScale = $uiFiles |
            Select-String -Pattern 'AutoScaleMode\s*=\s*AutoScaleMode\.(None|Font)'

          if ($forbiddenScale) {
            $forbiddenScale | ForEach-Object {
              Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())"
            }
            throw "WinForms UI must use the shared DPI scaling policy."
          }

          $fixedButtonSizes = $uiFiles |
            Select-String -Pattern 'new\s+Button\s*\{[^\r\n]*(Width|Height)\s*='

          if ($fixedButtonSizes) {
            $fixedButtonSizes | ForEach-Object {
              Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())"
            }
            throw "Buttons must use AutoSize/MinimumSize instead of fixed Width/Height."
          }

          $directFontFiles = $uiFiles |
            Where-Object { $_.Name -ne 'UiStyle.cs' }

          $directFontFailures = @()
          foreach ($file in $directFontFiles) {
            $raw = Get-Content $file.FullName -Raw
            if ($raw -match 'new\s+Font\s*\(\s*"(Segoe UI|Consolas)') {
              $directFontFailures += $file.FullName
            }
          }

          if ($directFontFailures) {
            $directFontFailures | ForEach-Object { Write-Host $_ }
            throw "Direct Segoe UI/Consolas construction is not allowed outside UiStyle. Use shared typography tokens."
          }

          $directButtonFiles = $uiFiles |
            Where-Object { $_.Name -ne 'UiStyle.cs' }

          $directButtonFailures = @()
          foreach ($file in $directButtonFiles) {
            $raw = Get-Content $file.FullName -Raw
            if ($raw -match '\bnew\s+Button\b') {
              $directButtonFailures += $file.FullName
            }
          }

          if ($directButtonFailures) {
            $directButtonFailures | ForEach-Object { Write-Host $_ }
            throw "Direct Button construction is not allowed outside UiStyle. Use UiStyle.CreateActionButton or a shared configured field."
          }

          $directListViewColumnFiles = $uiFiles |
            Where-Object { $_.Name -ne 'UiStyle.cs' }

          $directListViewColumnFailures = @()
          foreach ($file in $directListViewColumnFiles) {
            $raw = Get-Content $file.FullName -Raw
            if ($raw -match '\.Columns\.Add\s*\(' -or
                $raw -match '\bnew\s+ColumnHeader\b') {
              $directListViewColumnFailures += $file.FullName
            }
          }

          if ($directListViewColumnFailures) {
            $directListViewColumnFailures | ForEach-Object { Write-Host $_ }
            throw "Direct ListView column construction is not allowed outside UiStyle. Use UiStyle.ConfigureListViewColumns."
          }

      - name: Restore
        shell: cmd
        run: dotnet restore src\BitKeyBridge\BitKeyBridge.csproj

      - name: Build
        shell: cmd
        run: dotnet build src\BitKeyBridge\BitKeyBridge.csproj -c Release --no-restore

      - name: Publish self-contained single file
        shell: cmd
        run: dotnet publish src\BitKeyBridge\BitKeyBridge.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=true -o artifacts\${{ matrix.rid }}

      # Optional signing is only active if the runner certificate store contains
      # the trusted code-signing certificate AND its private key.
      # Set repository variable BITKEYBRIDGE_SIGNING_THUMBPRINT only after provisioning.
      - name: Optional Authenticode sign and verify
        # Organizational signing credentials are never used on PR or
        # workflow_dispatch: only an explicitly qualified release push.
        if: >-
          vars.BITKEYBRIDGE_SIGNING_THUMBPRINT != '' &&
          github.event_name == 'push' &&
          (
            startsWith(github.ref, 'refs/tags/v') ||
            (
              (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
              startsWith(github.event.head_commit.message, 'Release v')
            ) ||
            (
              github.ref == 'refs/heads/improve/nonadmin-audit-ui-20261014' &&
              startsWith(github.event.head_commit.message, 'Publish RC v0.30.0-rc.1')
            )
          )
        shell: pwsh
        env:
          SIGNING_THUMBPRINT: ${{ vars.BITKEYBRIDGE_SIGNING_THUMBPRINT }}
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Join-Path (Join-Path "artifacts" "${{ matrix.rid }}") "BitKeyBridge.exe"
          $tool = Get-Command signtool.exe -ErrorAction SilentlyContinue
          if (-not $tool) {
            $candidate = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -like "*\x64\signtool.exe" } |
              Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $candidate) { throw "SignTool not found. Install Windows SDK on signing runner." }
            $signToolPath = $candidate.FullName
          } else { $signToolPath = $tool.Source }
          if (-not (Test-Path $exe)) { throw "Published executable not found." }
          & $signToolPath sign /sha1 $env:SIGNING_THUMBPRINT /fd SHA256 /tr "http://timestamp.digicert.com" /td SHA256 "$exe"
          if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed." }
          & $signToolPath verify /pa /all /v "$exe"
          if ($LASTEXITCODE -ne 0) { throw "Authenticode validation failed." }
          Write-Host "Signed executable verified. SHA256SUMS are created after packaging."

      - name: Offline self-test (supported Windows Server architecture)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $exe = "artifacts\${{ matrix.rid }}\BitKeyBridge.exe"
          $report = "artifacts\${{ matrix.rid }}\self-test.log"
          $process = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          if (Test-Path $report) {
            Get-Content $report
          }
          if ($process.ExitCode -ne 0) {
            throw "Offline self-test failed with exit code $($process.ExitCode)."
          }

      - name: Runtime UI layout self-test
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $exe = "artifacts\${{ matrix.rid }}\BitKeyBridge.exe"
          $report = "artifacts\${{ matrix.rid }}\ui-self-test.log"
          $process = Start-Process -FilePath $exe -ArgumentList "--ui-self-test" -Wait -PassThru
          if (Test-Path $report) {
            Get-Content $report
          }
          if ($process.ExitCode -ne 0) {
            throw "Runtime UI layout self-test failed with exit code $($process.ExitCode)."
          }

      - name: Updater preference persistence self-test
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $exe = "artifacts\${{ matrix.rid }}\BitKeyBridge.exe"

          $disableOutput = & $exe --update-checks-disable --no-elevation 2>&1 | Out-String
          $disableExit = $LASTEXITCODE
          Write-Host $disableOutput
          if ($disableExit -ne 0) {
            throw "--update-checks-disable failed with exit code $disableExit."
          }

          $disabledStatus = & $exe --update-checks-status --no-elevation 2>&1 | Out-String
          $disabledExit = $LASTEXITCODE
          Write-Host $disabledStatus
          if ($disabledExit -ne 0 -or $disabledStatus -notmatch 'AutomaticChecks=False') {
            throw "Automatic update checks were not persisted as disabled."
          }

          $enableOutput = & $exe --update-checks-enable --no-elevation 2>&1 | Out-String
          $enableExit = $LASTEXITCODE
          Write-Host $enableOutput
          if ($enableExit -ne 0) {
            throw "--update-checks-enable failed with exit code $enableExit."
          }

          $enabledStatus = & $exe --update-checks-status --no-elevation 2>&1 | Out-String
          $enabledExit = $LASTEXITCODE
          Write-Host $enabledStatus
          if ($enabledExit -ne 0 -or $enabledStatus -notmatch 'AutomaticChecks=True') {
            throw "Automatic update checks were not persisted as enabled."
          }

          $autoDisableOutput = & $exe --auto-update-disable --no-elevation 2>&1 | Out-String
          $autoDisableExit = $LASTEXITCODE
          Write-Host $autoDisableOutput
          if ($autoDisableExit -ne 0) {
            throw "--auto-update-disable failed with exit code $autoDisableExit."
          }

          $autoDisabledStatus = & $exe --auto-update-status --no-elevation 2>&1 | Out-String
          $autoDisabledExit = $LASTEXITCODE
          Write-Host $autoDisabledStatus
          if ($autoDisabledExit -ne 0 -or $autoDisabledStatus -notmatch 'AutomaticInstall=False') {
            throw "Automatic update installation was not persisted as disabled."
          }

          $autoEnableOutput = & $exe --auto-update-enable --accept-unsigned-update-risk --no-elevation 2>&1 | Out-String
          $autoEnableExit = $LASTEXITCODE
          Write-Host $autoEnableOutput
          if ($autoEnableExit -ne 0) {
            throw "--auto-update-enable failed with exit code $autoEnableExit."
          }

          $autoEnabledStatus = & $exe --auto-update-status --no-elevation 2>&1 | Out-String
          $autoEnabledExit = $LASTEXITCODE
          Write-Host $autoEnabledStatus
          if ($autoEnabledExit -ne 0 -or
              $autoEnabledStatus -notmatch 'AutomaticInstall=True' -or
              $autoEnabledStatus -notmatch 'AutomaticChecks=True') {
            throw "Automatic update installation was not persisted as enabled."
          }

      - name: Package architecture
        shell: cmd
        run: tar -a -c -f artifacts\BitKeyBridge-${{ matrix.rid }}.zip -C artifacts\${{ matrix.rid }} .

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: BitKeyBridge-${{ matrix.rid }}
          path: artifacts/BitKeyBridge-${{ matrix.rid }}.zip
          if-no-files-found: error

  stable-test-bundle:
    # Test EXEs stay in Actions artifacts, never published as GitHub stable Latest.
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'stable/v0.30.0-20261016'
    needs: [build, laps-regression]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout acceptance instructions
        uses: actions/checkout@v7

      - name: Download x64 build artifact
        uses: actions/download-artifact@v8
        with:
          name: BitKeyBridge-win-x64
          path: test-bundle

      - name: Download x86 build artifact
        uses: actions/download-artifact@v8
        with:
          name: BitKeyBridge-win-x86
          path: test-bundle

      - name: Download ARM64 build artifact
        uses: actions/download-artifact@v8
        with:
          name: BitKeyBridge-win-arm64
          path: test-bundle

      - name: Generate SHA256 and staged-stable usage instructions
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          cp docs/stable-0.30.0-acceptance.md test-bundle/ACCEPTANCE.md
          cd test-bundle
          for rid in win-x64 win-x86 win-arm64; do
            test -s "BitKeyBridge-${rid}.zip"
          done
          sha256sum BitKeyBridge-win-x64.zip BitKeyBridge-win-x86.zip BitKeyBridge-win-arm64.zip > SHA256SUMS.txt
          printf 'CI checkout SHA: %s\nPR head commit: %s\nProductVersion: 0.30.0\n' "$GITHUB_SHA" "$PR_HEAD_SHA" > BUILD-INFO.txt
          cat > README-TEST.txt <<'EOF'
          BitKeyBridge v0.30.0 - UNSIGNED STAGED-STABLE TEST BUNDLE
          ========================================================
          IMPORTANT: This is NOT a published GitHub stable Release.
          Unsigned EXEs are for manual controlled QA, not production rollout.
          Do not distribute through GPO, Intune or unattended updating.
          The experimental SYSTEM Protected Audit Broker is NOT included.

          Files:
          BitKeyBridge-win-x64.zip     Windows x64 single-file EXE package
          BitKeyBridge-win-x86.zip     Windows x86 single-file EXE package
          BitKeyBridge-win-arm64.zip   Windows ARM64 single-file EXE package
          SHA256SUMS.txt              SHA-256 checksums for all three ZIPs
          BUILD-INFO.txt              Exact CI checkout and PR head source commits
          ACCEPTANCE.md               Managed-domain workstation QA checklist

          Extract only your architecture ZIP and run in a normal CMD:
            BitKeyBridge.exe --version
            BitKeyBridge.exe --self-test --no-elevation
            BitKeyBridge.exe --ui-self-test --no-elevation
            BitKeyBridge.exe --auto-update-status --no-elevation

          Check 100%-200% DPI, RDP, non-admin AD/Entra/LAPS/BitLocker
          allow/deny scenarios, secret lifetime and audit correctness.
          A real university Code Signing certificate, signed update/rollback
          and operator acceptance are required BEFORE public stable Latest.
          EOF

      - name: Upload one-click unsigned staged stable bundle
        uses: actions/upload-artifact@v7
        with:
          name: BitKeyBridge-v0.30.0-STABLE-CANDIDATE-UNSIGNED
          path: test-bundle/
          if-no-files-found: error
          retention-days: 90

  public-manual-stable:
    # Public Stable Latest with manual-only UNSIGNED archives.
    # The pre-0.30 auto-updater expects EXACTLY BitKeyBridge-win-<rid>.zip.
    # We must not offer canonical asset names until signing is approved.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'sgennadi/BitKeyBridge' &&
      startsWith(github.event.head_commit.message, 'Publish public stable v0.30.0')
    needs: [build, laps-regression]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout approved source
        uses: actions/checkout@v7

      - name: Download x64 build
        uses: actions/download-artifact@v8
        with:
          name: BitKeyBridge-win-x64
          path: unsigned-packages

      - name: Download x86 build
        uses: actions/download-artifact@v8
        with:
          name: BitKeyBridge-win-x86
          path: unsigned-packages

      - name: Download ARM64 build
        uses: actions/download-artifact@v8
        with:
          name: BitKeyBridge-win-arm64
          path: unsigned-packages

      - name: Validate and rename for safe manual installation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          grep -q '<Version>0.30.0</Version>' src/BitKeyBridge/BitKeyBridge.csproj
          grep -q '<InformationalVersion>0.30.0</InformationalVersion>' src/BitKeyBridge/BitKeyBridge.csproj
          test "$(cat .github/release-version.txt)" = "v0.30.0"
          test ! -f src/BitKeyBridge/Services/ProtectedAuditBrokerServer.cs
          if gh release view v0.30.0 --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing v0.30.0 release"
            exit 1
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/v0.30.0" >/dev/null 2>&1; then
            echo "Refusing to reuse existing v0.30.0 tag"
            exit 1
          fi
          mkdir -p public-release
          for rid in x64 x86 arm64; do
            src="unsigned-packages/BitKeyBridge-win-$rid.zip"
            dst="public-release/BitKeyBridge-v0.30.0-Windows-$rid-MANUAL-UNSIGNED.zip"
            test -s "$src"
            unzip -tq "$src" >/dev/null
            unzip -Z -1 "$src" | grep -Eq '(^|/)BitKeyBridge[.]exe$'
          cp "$src" "$dst"
          done
          cd public-release
          sha256sum BitKeyBridge-v0.30.0-Windows-*-MANUAL-UNSIGNED.zip > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          printf 'Version: v0.30.0\nSource SHA: %s\nBuild: GitHub Actions Windows x64/x86/ARM64\nSigning: UNSIGNED, MANUAL USE ONLY\n' "$SOURCE_SHA" > BUILD-INFO.txt
          test "$(find . -maxdepth 1 -name 'BitKeyBridge-win-*.zip' | wc -l)" -eq 0

      - name: Write public release notes
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          cat > public-release/RELEASE-NOTES.md <<'EOF'
          ## BitKeyBridge v0.30.0 - Public Stable (manual testing)

          This release is publicly available as Stable / Latest for technician
          testing on Windows. The EXE binaries are UNSIGNED. Do not distribute
          with GPO, Intune or unattended updates until institutional signing
          and real AD/Entra permissions acceptance have been completed.

          Changes from v0.29.12 include non-admin Helpdesk startup, the
          AD/Microsoft 365 connection wizard, on-demand LAPS and BitLocker
          recovery, improved access diagnostics, SemVer-aware updater
          functionality and responsive HiDPI/RDP WinForms layouts.
          Experimental Protected Audit Broker from Draft PR #57 is excluded.

          Architecture ZIPs contain MANUAL-UNSIGNED in their filename.
          These intentionally do NOT match the canonical file names required
          by older v0.29.x automatic updaters; therefore those clients cannot
          automatically install the unsigned release. Their update checks may
          report a missing compatible download until signed assets exist.

          Choose x64 for normal 64-bit Intel/AMD Windows, x86 for 32-bit
          Windows, and ARM64 for Windows on ARM. Verify the ZIP against
          SHA256SUMS.txt, extract it, and run BitKeyBridge.exe manually.

          For CMD smoke tests:
              BitKeyBridge.exe --version
              BitKeyBridge.exe --self-test --no-elevation
              BitKeyBridge.exe --ui-self-test --no-elevation
              BitKeyBridge.exe --auto-update-status --no-elevation

          GitHub CI validates Windows x64/x86/ARM64, LAPS, offline self-tests
          and UI layout. Real delegated AD/Entra/Intune, audit retention,
          organizational Authenticode and signed upgrade/rollback need
          managed-workstation testing before unattended production rollout.
          EOF
          printf '\nSource commit: %s\n' "$SOURCE_SHA" >> public-release/RELEASE-NOTES.md

      - name: Publish public Stable Latest v0.30.0
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh release create v0.30.0 \
            public-release/BitKeyBridge-v0.30.0-Windows-x64-MANUAL-UNSIGNED.zip \
            public-release/BitKeyBridge-v0.30.0-Windows-x86-MANUAL-UNSIGNED.zip \
            public-release/BitKeyBridge-v0.30.0-Windows-arm64-MANUAL-UNSIGNED.zip \
            public-release/SHA256SUMS.txt \
            public-release/BUILD-INFO.txt \
            --repo "$GH_REPO" --target "$SOURCE_SHA" --latest \
            --title "BitKeyBridge v0.30.0 - Stable Manual Download" \
            --notes-file public-release/RELEASE-NOTES.md

  release:
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
       startsWith(github.event.head_commit.message, 'Release v')) ||
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/improve/nonadmin-audit-ui-20261014' &&
       startsWith(github.event.head_commit.message, 'Publish RC v0.30.0-rc.1'))
    needs: [build, laps-regression]
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Resolve release tag
        id: release_meta
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $tag = "${{ github.ref_name }}"
          }
          else {
            [xml]$project = Get-Content src\BitKeyBridge\BitKeyBridge.csproj
            $version = @($project.Project.PropertyGroup.Version | Where-Object { $_ })[0]
            if (-not $version) { throw "Project version was not found." }
            $tag = "v$version"
          }

          if ($tag -notmatch '^v\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Resolved release tag is invalid: $tag"
          }

          [xml]$project = Get-Content src\BitKeyBridge\BitKeyBridge.csproj
          $projectVersion = @($project.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          if ($tag -ne "v$projectVersion") {
            throw "Release $tag does not match the tested project version $projectVersion."
          }
          if ("${{ github.ref }}" -eq "refs/heads/improve/nonadmin-audit-ui-20261014" -and
              $tag -ne "v0.30.0-rc.1") {
            throw "Staging branch is authorized only for v0.30.0-rc.1."
          }

          $exists = $false
          gh release view $tag --repo "${{ github.repository }}" *> $null
          $releaseViewExitCode = $LASTEXITCODE
          $global:LASTEXITCODE = 0

          if ($releaseViewExitCode -eq 0) {
            $exists = $true
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "exists=$($exists.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host "Release tag: $tag"
          Write-Host "Existing release: $exists"

      # Old v0.29.x clients may auto-install unsigned stable updates.
      - name: Require signed managed-workstation acceptance for stable v0.30.x
        if: steps.release_meta.outputs.exists != 'true'
        shell: pwsh
        env:
          STABLE_APPROVED: ${{ vars.BITKEYBRIDGE_STABLE_030_APPROVED }}
          SIGNING_THUMBPRINT: ${{ vars.BITKEYBRIDGE_SIGNING_THUMBPRINT }}
        run: |
          $tag = "${{ steps.release_meta.outputs.tag }}"
          if ($tag.StartsWith('v0.30.', [StringComparison]::OrdinalIgnoreCase) -and $tag -ne 'v0.30.0-rc.1') {
            if ($env:STABLE_APPROVED -ne 'true') {
              throw 'Public stable 0.30.x requires approved managed AD/Entra and update/rollback acceptance.'
            }
            if ($env:SIGNING_THUMBPRINT -notmatch '^[0-9a-fA-F]{40}$') {
              throw 'Public stable 0.30.x requires the university Code Signing certificate thumbprint.'
            }
          }

      - name: Download x64
        if: steps.release_meta.outputs.exists != 'true'
        uses: actions/download-artifact@v8
        with:
          name: BitKeyBridge-win-x64
          path: release

      - name: Download x86
        if: steps.release_meta.outputs.exists != 'true'
        uses: actions/download-artifact@v8
        with:
          name: BitKeyBridge-win-x86
          path: release

      - name: Download ARM64
        if: steps.release_meta.outputs.exists != 'true'
        uses: actions/download-artifact@v8
        with:
          name: BitKeyBridge-win-arm64
          path: release

      - name: Verify trusted signed x64 x86 ARM64 executables
        if: >-
          steps.release_meta.outputs.exists != 'true' &&
          startsWith(steps.release_meta.outputs.tag, 'v0.30.') &&
          steps.release_meta.outputs.tag != 'v0.30.0-rc.1'
        shell: pwsh
        env:
          SIGNING_THUMBPRINT: ${{ vars.BITKEYBRIDGE_SIGNING_THUMBPRINT }}
        run: |
          $ErrorActionPreference = 'Stop'
          ./tests/windows/Verify-ReleaseSigning.ps1 `
            -ReleaseDirectory release `
            -Tag "${{ steps.release_meta.outputs.tag }}" `
            -ExpectedThumbprint $env:SIGNING_THUMBPRINT `
            -ExpectedSourceRevision "${{ github.sha }}" `
            -OutputPath release/BitKeyBridge.signatures.json
          if (-not (Test-Path release/BitKeyBridge.signatures.json)) {
            throw 'Signed release verification evidence is missing.'
          }

      - name: Generate CycloneDX SBOM
        if: steps.release_meta.outputs.exists != 'true'
        shell: pwsh
        run: |
          dotnet tool install --tool-path .tools CycloneDX --version 6.2.0
          $version = "${{ steps.release_meta.outputs.tag }}".TrimStart("v")
          .\.tools\dotnet-CycloneDX.exe src\BitKeyBridge\BitKeyBridge.csproj -o release -fn BitKeyBridge.cdx.json -F Json -spv 1.7 -sn BitKeyBridge -sv $version -st Application

      - name: Generate SHA256SUMS
        if: steps.release_meta.outputs.exists != 'true'
        shell: bash
        run: |
          cd release
          files=(BitKeyBridge-win-x64.zip BitKeyBridge-win-x86.zip BitKeyBridge-win-arm64.zip BitKeyBridge.cdx.json)
          if [[ -f BitKeyBridge.signatures.json ]]; then
            files+=(BitKeyBridge.signatures.json)
          fi
          sha256sum "${files[@]}" > SHA256SUMS.txt

      - name: Attest release provenance
        if: steps.release_meta.outputs.exists != 'true'
        uses: actions/attest@v4
        with:
          subject-path: |
            release/BitKeyBridge-win-x64.zip
            release/BitKeyBridge-win-x86.zip
            release/BitKeyBridge-win-arm64.zip
            release/BitKeyBridge.cdx.json
            release/SHA256SUMS.txt

      - name: Attest verified Authenticode release identity
        if: >-
          steps.release_meta.outputs.exists != 'true' &&
          startsWith(steps.release_meta.outputs.tag, 'v0.30.') &&
          steps.release_meta.outputs.tag != 'v0.30.0-rc.1'
        uses: actions/attest@v4
        with:
          subject-path: release/BitKeyBridge.signatures.json

      - name: Attest release SBOM
        if: steps.release_meta.outputs.exists != 'true'
        uses: actions/attest@v4
        with:
          subject-path: |
            release/BitKeyBridge-win-x64.zip
            release/BitKeyBridge-win-x86.zip
            release/BitKeyBridge-win-arm64.zip
          sbom-path: release/BitKeyBridge.cdx.json

      - name: Smoke-test staged updater preferences (no network install)
        if: steps.release_meta.outputs.exists != 'true'
        shell: pwsh
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP "bitkeybridge-updater-smoke"
          Remove-Item $smokeRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $smokeRoot | Out-Null
          Expand-Archive -Path release\BitKeyBridge-win-x64.zip -DestinationPath $smokeRoot -Force
          $exe = Join-Path $smokeRoot "BitKeyBridge.exe"

          # Prepublication acceptance stays LOCAL: do not contact the public
          # Releases API or apply new executable files in CI.
          # Remote update/rollback needs a separate managed-machine test.

          $disableOutput = & $exe --update-checks-disable --no-elevation 2>&1 | Out-String
          $disableExit = $LASTEXITCODE
          Write-Host $disableOutput
          if ($disableExit -ne 0) {
            throw "--update-checks-disable failed with exit code $disableExit."
          }

          $disabledStatus = & $exe --update-checks-status --no-elevation 2>&1 | Out-String
          Write-Host $disabledStatus
          if ($disabledStatus -notmatch 'AutomaticChecks=False') {
            throw "Automatic update checks were not persisted as disabled."
          }

          $enableOutput = & $exe --update-checks-enable --no-elevation 2>&1 | Out-String
          $enableExit = $LASTEXITCODE
          Write-Host $enableOutput
          if ($enableExit -ne 0) {
            throw "--update-checks-enable failed with exit code $enableExit."
          }

          $enabledStatus = & $exe --update-checks-status --no-elevation 2>&1 | Out-String
          Write-Host $enabledStatus
          if ($enabledStatus -notmatch 'AutomaticChecks=True') {
            throw "Automatic update checks were not persisted as enabled."
          }

          $autoDisableOutput = & $exe --auto-update-disable --no-elevation 2>&1 | Out-String
          Write-Host $autoDisableOutput
          if ($LASTEXITCODE -ne 0) {
            throw "--auto-update-disable failed."
          }

          $autoDisabledStatus = & $exe --auto-update-status --no-elevation 2>&1 | Out-String
          Write-Host $autoDisabledStatus
          if ($autoDisabledStatus -notmatch 'AutomaticInstall=False') {
            throw "Automatic update installation was not persisted as disabled."
          }

          $autoEnableOutput = & $exe --auto-update-enable --accept-unsigned-update-risk --no-elevation 2>&1 | Out-String
          Write-Host $autoEnableOutput
          if ($LASTEXITCODE -ne 0) {
            throw "--auto-update-enable failed."
          }

          $autoEnabledStatus = & $exe --auto-update-status --no-elevation 2>&1 | Out-String
          Write-Host $autoEnabledStatus
          if ($autoEnabledStatus -notmatch 'AutomaticInstall=True' -or
              $autoEnabledStatus -notmatch 'AutomaticChecks=True') {
            throw "Automatic update installation was not persisted as enabled."
          }

          Write-Host 'Staged updater controls passed. No installation attempted.'

      - name: Create GitHub Release
        if: steps.release_meta.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.release_meta.outputs.tag }}"
          $assets = @(
            'release/BitKeyBridge-win-x64.zip',
            'release/BitKeyBridge-win-x86.zip',
            'release/BitKeyBridge-win-arm64.zip',
            'release/BitKeyBridge.cdx.json',
            'release/SHA256SUMS.txt'
          )
          if (Test-Path 'release/BitKeyBridge.signatures.json') {
            $assets += 'release/BitKeyBridge.signatures.json'
          }
          $args = @('release', 'create', $tag) + $assets + @(
            '--repo', '${{ github.repository }}',
            '--target', '${{ github.sha }}',
            '--generate-notes',
            '--title', "BitKeyBridge $tag"
          )
          if ($tag.Contains('-')) {
            # Mark RC/beta as prerelease. Never override GitHub stable Latest.
            $args += '--prerelease'
          }
          & gh @args
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release creation failed for $tag."
          }


  public-unsigned-auto:
    # Owner-authorized, unsigned v0.30.1 public update using canonical names.
    # Older v0.29.x machines with automatic install enabled may install it.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'sgennadi/BitKeyBridge' &&
      startsWith(github.event.head_commit.message, 'Publish unsigned auto-update v0.30.1')
    needs: [build, laps-regression]
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Download validated x64 ZIP
        uses: actions/download-artifact@v8
        with:
          name: BitKeyBridge-win-x64
          path: release

      - name: Download validated x86 ZIP
        uses: actions/download-artifact@v8
        with:
          name: BitKeyBridge-win-x86
          path: release

      - name: Download validated ARM64 ZIP
        uses: actions/download-artifact@v8
        with:
          name: BitKeyBridge-win-arm64
          path: release

      - name: Verify version, architecture and exact ZIP identities
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$proj = Get-Content src\BitKeyBridge\BitKeyBridge.csproj
          $v = @($proj.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          $informational = @($proj.Project.PropertyGroup.InformationalVersion | Where-Object { $_ })[0]
          if ($v -ne '0.30.1' -or $informational -ne '0.30.1' -or
              (Get-Content .github/release-version.txt -Raw).Trim() -ne 'v0.30.1') {
            throw 'Wrong project version or release manifest for v0.30.1.'
          }
          if (Test-Path src\BitKeyBridge\Services\ProtectedAuditBrokerServer.cs) {
            throw 'Experimental protected audit broker cannot enter stable v0.30.1.'
          }
          & gh release view v0.30.1 --repo "$env:GH_REPO" *> $null
          $existingRelease = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          if ($existingRelease -eq 0) {
            throw 'v0.30.1 already published. Never overwrite a stable release.'
          }
          & gh api "repos/$env:GH_REPO/git/ref/tags/v0.30.1" *> $null
          $existingTag = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          if ($existingTag -eq 0) {
            throw 'v0.30.1 tag already exists. Never retarget a stable tag.'
          }
          $machines = @{'win-x64'=0x8664; 'win-x86'=0x014c; 'win-arm64'=0xaa64}
          foreach ($rid in @('win-x64','win-x86','win-arm64')) {
            $zip = Join-Path release "BitKeyBridge-$rid.zip"
            if (-not (Test-Path $zip) -or (Get-Item $zip).Length -lt 100000) {
              throw "Missing or empty canonical release ZIP: $zip"
            }
            $dir = Join-Path $env:RUNNER_TEMP "check-$rid"
            New-Item -ItemType Directory -Path $dir -Force | Out-Null
            Expand-Archive -Path $zip -DestinationPath $dir -Force
            $exe = Join-Path $dir 'BitKeyBridge.exe'
            $exes = @(Get-ChildItem $dir -Filter BitKeyBridge.exe -File -Recurse)
            if ($exes.Count -ne 1 -or -not (Test-Path $exe) -or
                -not [string]::Equals($exes[0].FullName,$exe,[StringComparison]::OrdinalIgnoreCase)) {
              throw "$rid must contain exactly one BitKeyBridge.exe at ZIP root."
            }
            $info = [Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
            if ($info.FileVersion -ne '0.30.1.0' -or
                $info.ProductVersion -notmatch '^0[.]30[.]1([+][0-9a-zA-Z.-]+)?$') {
              throw "Incorrect $rid version: $($info.FileVersion)/$($info.ProductVersion)"
            }
            $stream = [IO.File]::OpenRead($exe)
            $reader = [IO.BinaryReader]::new($stream)
            try {
              $stream.Position = 0x3c
              $offset = $reader.ReadInt32()
              if ($offset -lt 64 -or $offset -ge $stream.Length - 6) {
                throw "$rid invalid PE offset."
              }
              $stream.Position = $offset
              if ($reader.ReadUInt32() -ne 0x00004550) { throw "$rid invalid PE signature." }
              $machine = [int]$reader.ReadUInt16()
              if ($machine -ne $machines[$rid]) {
                throw "$rid machine mismatch: 0x$($machine.ToString('X4'))."
              }
            }
            finally {
              $reader.Dispose()
            }
            Write-Host "Verified $rid PE architecture and ProductVersion 0.30.1"
          }

      - name: Smoke-test unsigned auto-update opt-in without network installation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'unsigned-update-smoke'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          Expand-Archive release\BitKeyBridge-win-x64.zip -DestinationPath $dir -Force
          $exe = Join-Path $dir 'BitKeyBridge.exe'
          & $exe --auto-update-disable --no-elevation | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Cannot disable automatic updates.' }
          $noConsent = & $exe --auto-update-enable --no-elevation 2>&1 | Out-String
          Write-Host $noConsent
          if ($LASTEXITCODE -eq 0) { throw 'Unattended updates started without explicit consent.' }
          $consented = & $exe --auto-update-enable --accept-unsigned-update-risk --no-elevation 2>&1 | Out-String
          Write-Host $consented
          if ($LASTEXITCODE -ne 0) { throw 'Explicit unsigned auto-update consent was rejected.' }
          $status = & $exe --auto-update-status --no-elevation 2>&1 | Out-String
          Write-Host $status
          if ($LASTEXITCODE -ne 0 -or $status -notmatch 'UnsignedConsent=True' -or
              $status -notmatch 'AutomaticInstall=True' -or
              $status -notmatch 'AutomaticChecks=True') {
            throw 'Auto-update opt-in did not persist securely.'
          }
          & $exe --auto-update-disable --no-elevation | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Auto-install cleanup failed.' }
          Write-Host 'Local consent check passed; no network updater executed.'

      - name: Generate CycloneDX SBOM
        shell: pwsh
        run: |
          dotnet tool install --tool-path .tools CycloneDX --version 6.2.0
          if ($LASTEXITCODE -ne 0) { throw 'CycloneDX install failed.' }
          .\.tools\dotnet-CycloneDX.exe src\BitKeyBridge\BitKeyBridge.csproj -o release -fn BitKeyBridge.cdx.json -F Json -spv 1.7 -sn BitKeyBridge -sv 0.30.1 -st Application
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path release\BitKeyBridge.cdx.json)) {
            throw 'CycloneDX generation failed.'
          }

      - name: Prepare GitHub checksum metadata and unsigned release notes
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cat > release/RELEASE-NOTES.md <<'EOF'
          ## BitKeyBridge v0.30.1 - Stable auto-update (UNSIGNED)

          This public stable release provides standard BitKeyBridge-win-x64.zip,
          BitKeyBridge-win-x86.zip and BitKeyBridge-win-arm64.zip archives.

          WARNING: no Authenticode code signing certificate is configured.
          Some older BitKeyBridge v0.29.x computers with automatic installation
          already enabled MAY UPDATE AUTOMATICALLY on the next launch.
          SHA-256 and GitHub provenance detect corruption but do NOT provide
          independent publisher verification.

          v0.30.1 defaults to update checks only. Explicit unsigned auto-install:
              BitKeyBridge.exe --auto-update-enable --accept-unsigned-update-risk --no-elevation
          Disable it:
              BitKeyBridge.exe --auto-update-disable --no-elevation

          The updated GUI also offers an unsigned opt-in with a risk warning.
          The opt-in works only with the official sgennadi/BitKeyBridge GitHub
          repository, and does not override an Authenticode publisher policy.

          The updater validates HTTPS, repository/tag/architecture asset
          identity, exact package size, GitHub SHA-256 digest, SHA256SUMS,
          executable version, self-test and rollback consistency.
          The experimental SYSTEM audit broker from PR #57 is excluded.
          LAPS/BitLocker, AD/Entra connection, permission diagnostics and
          HiDPI/RDP Helpdesk functions are retained. Live campus authorization
          tests remain an on-site operations requirement.
          EOF
          printf '\nSource commit: %s\n' "$SOURCE_SHA" >> release/RELEASE-NOTES.md
          printf 'Version: v0.30.1\nSource SHA: %s\nAuthenticode: UNSIGNED\nCanonical auto-update ZIPs: YES\n' "$SOURCE_SHA" > release/BUILD-INFO.txt
          cd release
          sha256sum BitKeyBridge-win-x64.zip BitKeyBridge-win-x86.zip BitKeyBridge-win-arm64.zip BitKeyBridge.cdx.json BUILD-INFO.txt > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Attest release packages
        uses: actions/attest@v4
        with:
          subject-path: |
            release/BitKeyBridge-win-x64.zip
            release/BitKeyBridge-win-x86.zip
            release/BitKeyBridge-win-arm64.zip
            release/BitKeyBridge.cdx.json
            release/SHA256SUMS.txt
            release/BUILD-INFO.txt

      - name: Attest release SBOM
        uses: actions/attest@v4
        with:
          subject-path: |
            release/BitKeyBridge-win-x64.zip
            release/BitKeyBridge-win-x86.zip
            release/BitKeyBridge-win-arm64.zip
          sbom-path: release/BitKeyBridge.cdx.json

      - name: Publish unsigned stable auto-update v0.30.1
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh release create v0.30.1 \
            release/BitKeyBridge-win-x64.zip \
            release/BitKeyBridge-win-x86.zip \
            release/BitKeyBridge-win-arm64.zip \
            release/BitKeyBridge.cdx.json \
            release/SHA256SUMS.txt \
            release/BUILD-INFO.txt \
            --repo "$GH_REPO" --target "$SOURCE_SHA" --latest \
            --title "BitKeyBridge v0.30.1 - Stable Auto-Update (Unsigned)" \
            --notes-file release/RELEASE-NOTES.md
