name: build

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-x86, win-arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        shell: cmd
        run: dotnet restore src\BitKeyBridge\BitKeyBridge.csproj

      - name: Build
        shell: cmd
        run: dotnet build src\BitKeyBridge\BitKeyBridge.csproj -c Release --no-restore

      - name: Publish self-contained single file
        shell: cmd
        run: dotnet publish src\BitKeyBridge\BitKeyBridge.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=true -o artifacts\${{ matrix.rid }}

      - name: Offline self-test (supported Windows Server architecture)
        if: matrix.rid == 'win-x64'
        shell: cmd
        run: start /wait "" artifacts\${{ matrix.rid }}\BitKeyBridge.exe --self-test

      - name: Package architecture
        shell: cmd
        run: tar -a -c -f artifacts\BitKeyBridge-${{ matrix.rid }}.zip -C artifacts\${{ matrix.rid }} .

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: BitKeyBridge-${{ matrix.rid }}
          path: artifacts/BitKeyBridge-${{ matrix.rid }}.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    steps:
      - name: Download x64
        uses: actions/download-artifact@v7
        with:
          name: BitKeyBridge-win-x64
          path: release

      - name: Download x86
        uses: actions/download-artifact@v7
        with:
          name: BitKeyBridge-win-x86
          path: release

      - name: Download ARM64
        uses: actions/download-artifact@v7
        with:
          name: BitKeyBridge-win-arm64
          path: release

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          cd release
          sha256sum BitKeyBridge-win-x64.zip BitKeyBridge-win-x86.zip BitKeyBridge-win-arm64.zip > SHA256SUMS.txt

      - name: Create GitHub Release
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "%GITHUB_REF_NAME%" release\BitKeyBridge-win-x64.zip release\BitKeyBridge-win-x86.zip release\BitKeyBridge-win-arm64.zip release\SHA256SUMS.txt --repo "%GITHUB_REPOSITORY%" --generate-notes --title "%GITHUB_REF_NAME%"
