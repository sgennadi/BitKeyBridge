name: build

on:
  push:
    # This temporary RC staging branch publishes only on an explicit final
    # commit, and only after x64/x86/ARM64 and LAPS regression checks pass.
    branches: [ "main", "master", "improve/nonadmin-audit-ui-20261014", "release/v0.30.3" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

# Compiling untrusted pull request code must never receive write/release
# credentials. Only the explicitly gated release job may publish or attest.
permissions:
  contents: read

concurrency:
  # Bind concurrency to the exact commit. GitHub can deliver rapid PR
  # synchronize events out of order; an older event must never cancel CI for
  # the current PR head.
  group: bitkeybridge-${{ github.workflow }}-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  laps-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: LAPS encoding, history and secret lifecycle regression checks
        run: dotnet run --project tests/LapsRegression -c Release

  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-x86, win-arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Verify CHANGELOG versions
        shell: pwsh
        run: |
          [xml]$project = Get-Content src\BitKeyBridge\BitKeyBridge.csproj
          $version = @($project.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          if (-not $version) { throw "Project version was not found." }

          $versions = @(
            Get-Content CHANGELOG.md |
              Where-Object { $_ -match '^##\s+\d+\.\d+\.\d+' } |
              ForEach-Object {
                ($_ -replace '^##\s+', '').Trim()
              }
          )

          $currentCount = @($versions | Where-Object { $_ -eq $version }).Count
          if ($currentCount -ne 1) {
            throw "CHANGELOG.md must contain exactly one section for project version $version; found $currentCount."
          }

          $duplicates = @(
            $versions |
              Group-Object |
              Where-Object { $_.Count -gt 1 } |
              Sort-Object Name
          )

          if ($duplicates.Count -gt 0) {
            $duplicates | ForEach-Object {
              Write-Host "Duplicate CHANGELOG version: $($_.Name) ($($_.Count) sections)"
            }
            throw "CHANGELOG.md contains duplicate version headings."
          }

      - name: Reject silent empty catch blocks
        shell: pwsh
        run: |
          $failures = @()
          $files = Get-ChildItem src\BitKeyBridge -Recurse -Filter *.cs -File
          $pattern = 'catch\s*(\([^\)]*\))?\s*\{\s*\}'
          foreach ($file in $files) {
            $raw = Get-Content $file.FullName -Raw
            if ([regex]::IsMatch(
                  $raw,
                  $pattern,
                  [System.Text.RegularExpressions.RegexOptions]::Singleline)) {
              $failures += $file.FullName
            }
          }

          if ($failures) {
            $failures | ForEach-Object { Write-Host $_ }
            throw "Silent empty catch blocks are not allowed. Handle, log, or explicitly report non-fatal failures."
          }

      - name: Reject blocking error MessageBoxes
        shell: pwsh
        run: |
          $uiFiles = Get-ChildItem src\BitKeyBridge\UI -Filter *.cs -File
          $matches = $uiFiles | Select-String -Pattern 'MessageBoxIcon\.Error'
          if ($matches) {
            $matches | ForEach-Object {
              Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())"
            }
            throw "Blocking error MessageBoxes are not allowed. Use UiDiagnosticPanel for errors; reserve modal dialogs for confirmations and user decisions."
          }

      - name: Reject fixed-position WinForms layout
        shell: pwsh
        run: |
          $uiFiles = Get-ChildItem src\BitKeyBridge\UI -Filter *.cs -File
          $matches = $uiFiles | Select-String -Pattern 'SetBounds\s*\(|\bLeft\s*=|\bTop\s*='
          if ($matches) {
            $matches | ForEach-Object {
              Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())"
            }
            throw "Fixed-position WinForms layout is not allowed in src/BitKeyBridge/UI. Use TableLayoutPanel/FlowLayoutPanel/Dock/Anchor instead."
          }

      - name: Verify HiDPI WinForms conventions
        shell: pwsh
        run: |
          $project = Get-Content src\BitKeyBridge\BitKeyBridge.csproj -Raw
          if ($project -notmatch '<ApplicationHighDpiMode>PerMonitorV2</ApplicationHighDpiMode>') {
            throw "ApplicationHighDpiMode must remain PerMonitorV2."
          }

          $dpiBase = Get-Content src\BitKeyBridge\UI\DpiAwareForm.cs -Raw
          if ($dpiBase -notmatch 'AutoScaleMode\s*=\s*AutoScaleMode\.Dpi') {
            throw "DpiAwareForm must use AutoScaleMode.Dpi."
          }

          $uiFiles = Get-ChildItem src\BitKeyBridge\UI -Filter *.cs -File
          $directForms = $uiFiles |
            Where-Object { $_.Name -ne 'DpiAwareForm.cs' } |
            Select-String -Pattern 'class\s+\w+\s*:\s*Form\b'

          if ($directForms) {
            $directForms | ForEach-Object {
              Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())"
            }
            throw "All application forms must inherit DpiAwareForm."
          }

          $forbiddenScale = $uiFiles |
            Select-String -Pattern 'AutoScaleMode\s*=\s*AutoScaleMode\.(None|Font)'

          if ($forbiddenScale) {
            $forbiddenScale | ForEach-Object {
              Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())"
            }
            throw "WinForms UI must use the shared DPI scaling policy."
          }

          $fixedButtonSizes = $uiFiles |
            Select-String -Pattern 'new\s+Button\s*\{[^\r\n]*(Width|Height)\s*='

          if ($fixedButtonSizes) {
            $fixedButtonSizes | ForEach-Object {
              Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())"
            }
            throw "Buttons must use AutoSize/MinimumSize instead of fixed Width/Height."
          }

          $directFontFiles = $uiFiles |
            Where-Object { $_.Name -ne 'UiStyle.cs' }

          $directFontFailures = @()
          foreach ($file in $directFontFiles) {
            $raw = Get-Content $file.FullName -Raw
            if ($raw -match 'new\s+Font\s*\(\s*"(Segoe UI|Consolas)') {
              $directFontFailures += $file.FullName
            }
          }

          if ($directFontFailures) {
            $directFontFailures | ForEach-Object { Write-Host $_ }
            throw "Direct Segoe UI/Consolas construction is not allowed outside UiStyle. Use shared typography tokens."
          }

          $directButtonFiles = $uiFiles |
            Where-Object { $_.Name -ne 'UiStyle.cs' }

          $directButtonFailures = @()
          foreach ($file in $directButtonFiles) {
            $raw = Get-Content $file.FullName -Raw
            if ($raw -match '\bnew\s+Button\b') {
              $directButtonFailures += $file.FullName
            }
          }

          if ($directButtonFailures) {
            $directButtonFailures | ForEach-Object { Write-Host $_ }
            throw "Direct Button construction is not allowed outside UiStyle. Use UiStyle.CreateActionButton or a shared configured field."
          }

          $directListViewColumnFiles = $uiFiles |
            Where-Object { $_.Name -ne 'UiStyle.cs' }

          $directListViewColumnFailures = @()
          foreach ($file in $directListViewColumnFiles) {
            $raw = Get-Content $file.FullName -Raw
            if ($raw -match '\.Columns\.Add\s*\(' -or
                $raw -match '\bnew\s+ColumnHeader\b') {
              $directListViewColumnFailures += $file.FullName
            }
          }

          if ($directListViewColumnFailures) {
            $directListViewColumnFailures | ForEach-Object { Write-Host $_ }
            throw "Direct ListView column construction is not allowed outside UiStyle. Use UiStyle.ConfigureListViewColumns."
          }

      - name: Validate project versions under PowerShell StrictMode
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          [xml]$project = Get-Content src/BitKeyBridge/BitKeyBridge.csproj -Raw
          $versions = @($project.SelectNodes('/Project/PropertyGroup/Version'))
          $informational = @($project.SelectNodes('/Project/PropertyGroup/InformationalVersion'))
          if ($versions.Count -ne 1 -or $informational.Count -ne 1) {
            throw "Expected exactly one Version and InformationalVersion node."
          }
          $version = [string]$versions[0].InnerText.Trim()
          $informationalVersion = [string]$informational[0].InnerText.Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[A-Za-z0-9.-]+)?$' -or
              $version -cne $informationalVersion) {
            throw "Project metadata versions do not match valid SemVer."
          }
          Write-Host "Verified strict-mode project release version: $version"

      - name: Parse-check PowerShell Windows QA scripts
        shell: pwsh
        run: |
          $issues = @()
          foreach ($file in (Get-ChildItem tests/windows -Recurse -Filter *.ps1 -File)) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName, [ref]$tokens, [ref]$parseErrors)
            foreach ($issue in $parseErrors) {
              $issues += "$($file.Name):$($issue.Extent.StartLineNumber): $($issue.Message)"
            }
          }
          if ($issues.Count -ne 0) {
            $issues | ForEach-Object { Write-Host $_ }
            throw "PowerShell QA scripts contain syntax errors."
          }

      - name: Restore
        shell: cmd
        run: dotnet restore src\BitKeyBridge\BitKeyBridge.csproj

      - name: Build
        shell: cmd
        run: dotnet build src\BitKeyBridge\BitKeyBridge.csproj -c Release --no-restore

      - name: Publish self-contained single file
        shell: cmd
        run: dotnet publish src\BitKeyBridge\BitKeyBridge.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=true -o artifacts\${{ matrix.rid }}

      # Optional signing is only active if the runner certificate store contains
      # the trusted code-signing certificate AND its private key.
      # Set repository variable BITKEYBRIDGE_SIGNING_THUMBPRINT only after provisioning.
      - name: Optional Authenticode sign and verify
        # Organizational signing credentials are never used on PR or
        # workflow_dispatch: only an explicitly qualified release push.
        if: >-
          vars.BITKEYBRIDGE_SIGNING_THUMBPRINT != '' &&
          github.event_name == 'push' &&
          (
            startsWith(github.ref, 'refs/tags/v') ||
            (
              (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
              startsWith(github.event.head_commit.message, 'Release v')
            ) ||
            (
              github.ref == 'refs/heads/improve/nonadmin-audit-ui-20261014' &&
              startsWith(github.event.head_commit.message, 'Publish RC v0.30.0-rc.1')
            )
          )
        shell: pwsh
        env:
          SIGNING_THUMBPRINT: ${{ vars.BITKEYBRIDGE_SIGNING_THUMBPRINT }}
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Join-Path (Join-Path "artifacts" "${{ matrix.rid }}") "BitKeyBridge.exe"
          $tool = Get-Command signtool.exe -ErrorAction SilentlyContinue
          if (-not $tool) {
            $candidate = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -like "*\x64\signtool.exe" } |
              Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $candidate) { throw "SignTool not found. Install Windows SDK on signing runner." }
            $signToolPath = $candidate.FullName
          } else { $signToolPath = $tool.Source }
          if (-not (Test-Path $exe)) { throw "Published executable not found." }
          & $signToolPath sign /sha1 $env:SIGNING_THUMBPRINT /fd SHA256 /tr "http://timestamp.digicert.com" /td SHA256 "$exe"
          if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed." }
          & $signToolPath verify /pa /all /v "$exe"
          if ($LASTEXITCODE -ne 0) { throw "Authenticode validation failed." }
          Write-Host "Signed executable verified. SHA256SUMS are created after packaging."

      - name: Offline self-test (supported Windows Server architecture)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $exe = "artifacts\${{ matrix.rid }}\BitKeyBridge.exe"
          $report = "artifacts\${{ matrix.rid }}\self-test.log"
          $process = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          if (Test-Path $report) {
            Get-Content $report
          }
          if ($process.ExitCode -ne 0) {
            throw "Offline self-test failed with exit code $($process.ExitCode)."
          }

      - name: Runtime UI layout self-test
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $exe = "artifacts\${{ matrix.rid }}\BitKeyBridge.exe"
          $report = "artifacts\${{ matrix.rid }}\ui-self-test.log"
          $process = Start-Process -FilePath $exe -ArgumentList "--ui-self-test" -Wait -PassThru
          if (Test-Path $report) {
            Get-Content $report
          }
          if ($process.ExitCode -ne 0) {
            throw "Runtime UI layout self-test failed with exit code $($process.ExitCode)."
          }

      # Basic JSON contract smoke on a CI runner. The broker integration job
      # separately launches this mode under TWO genuine non-admin accounts.
      - name: Startup diagnostics JSON smoke
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $exe = "artifacts\${{ matrix.rid }}\BitKeyBridge.exe"
          $output = & $exe --startup-diagnostics --no-elevation 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) {
            throw "Startup diagnostics failed with exit code $LASTEXITCODE."
          }
          $report = $output | ConvertFrom-Json
          if ($report.Mode -ne "NonElevatingStartupDiagnostics" -or
              -not $report.Checks -or
              -not $report.ProcessArchitecture) {
            throw "Startup diagnostics did not return the expected secret-free JSON report."
          }
          Write-Host "Non-elevating startup diagnostics: $($report.Checks.Count) checks."

      - name: Updater preference persistence self-test
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $exe = "artifacts\${{ matrix.rid }}\BitKeyBridge.exe"

          $disableOutput = & $exe --update-checks-disable --no-elevation 2>&1 | Out-String
          $disableExit = $LASTEXITCODE
          Write-Host $disableOutput
          if ($disableExit -ne 0) {
            throw "--update-checks-disable failed with exit code $disableExit."
          }

          $disabledStatus = & $exe --update-checks-status --no-elevation 2>&1 | Out-String
          $disabledExit = $LASTEXITCODE
          Write-Host $disabledStatus
          if ($disabledExit -ne 0 -or $disabledStatus -notmatch 'AutomaticChecks=False') {
            throw "Automatic update checks were not persisted as disabled."
          }

          $enableOutput = & $exe --update-checks-enable --no-elevation 2>&1 | Out-String
          $enableExit = $LASTEXITCODE
          Write-Host $enableOutput
          if ($enableExit -ne 0) {
            throw "--update-checks-enable failed with exit code $enableExit."
          }

          $enabledStatus = & $exe --update-checks-status --no-elevation 2>&1 | Out-String
          $enabledExit = $LASTEXITCODE
          Write-Host $enabledStatus
          if ($enabledExit -ne 0 -or $enabledStatus -notmatch 'AutomaticChecks=True') {
            throw "Automatic update checks were not persisted as enabled."
          }

          $autoDisableOutput = & $exe --auto-update-disable --no-elevation 2>&1 | Out-String
          $autoDisableExit = $LASTEXITCODE
          Write-Host $autoDisableOutput
          if ($autoDisableExit -ne 0) {
            throw "--auto-update-disable failed with exit code $autoDisableExit."
          }

          $autoDisabledStatus = & $exe --auto-update-status --no-elevation 2>&1 | Out-String
          $autoDisabledExit = $LASTEXITCODE
          Write-Host $autoDisabledStatus
          if ($autoDisabledExit -ne 0 -or $autoDisabledStatus -notmatch 'AutomaticInstall=False') {
            throw "Automatic update installation was not persisted as disabled."
          }

          $deniedOutput = & $exe --auto-update-enable --no-elevation 2>&1 | Out-String
          if ($LASTEXITCODE -eq 0) {
            throw "Unsigned auto-install incorrectly accepted without explicit consent."
          }
          $autoEnableOutput = & $exe --auto-update-enable --accept-unsigned-update-risk --no-elevation 2>&1 | Out-String
          $autoEnableExit = $LASTEXITCODE
          Write-Host $autoEnableOutput
          if ($autoEnableExit -ne 0) {
            throw "Explicit unsigned auto-install enable failed ($autoEnableExit)."
          }

          $autoEnabledStatus = & $exe --auto-update-status --no-elevation 2>&1 | Out-String
          $autoEnabledExit = $LASTEXITCODE
          Write-Host $autoEnabledStatus
          if ($autoEnabledExit -ne 0 -or
              $autoEnabledStatus -notmatch 'AutomaticInstall=True' -or
              $autoEnabledStatus -notmatch 'AutomaticChecks=True' -or
              $autoEnabledStatus -notmatch 'UnsignedConsent=True' -or
              $autoEnabledStatus -notmatch 'Unsigned opt-in') {
            throw "Automatic update installation was not persisted as enabled."
          }

      - name: Guard release workflow ordering and branch safety
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          ./tests/windows/ReleaseWorkflowSafety.ps1

      - name: Regression - reject invalid or unauthorized release signing
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          ./tests/windows/ReleaseSigningGateSmoke.ps1 -Executable "artifacts/win-x64/BitKeyBridge.exe"

      - name: Package architecture
        shell: cmd
        run: tar -a -c -f artifacts\BitKeyBridge-${{ matrix.rid }}.zip -C artifacts\${{ matrix.rid }} .

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: BitKeyBridge-${{ matrix.rid }}
          path: artifacts/BitKeyBridge-${{ matrix.rid }}.zip
          if-no-files-found: error

  audit-broker-integration:
    # Must run only on GitHub-hosted ephemeral Windows. This isolated test
    # creates temporary local accounts, installs an SCM service and adjusts
    # ProgramData ACLs; it must never run on a persistent/self-hosted machine.
    if: >-
      (github.event_name == 'pull_request' &&
       (github.head_ref == 'feature/protected-audit-broker-20261014' ||
        github.head_ref == 'integration/v0.30.2-audit-broker-updater-20261016' ||
        github.head_ref == 'feature/v0.30.3-helpdesk-ux-20261016')) ||
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/release/v0.30.3')
    needs: [build]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout integration harness
        uses: actions/checkout@v7

      - name: Download tested x64 executable package
        uses: actions/download-artifact@v8
        with:
          name: BitKeyBridge-win-x64
          path: broker-integration

      - name: Verify strict audit with two genuine standard Windows tokens
        shell: pwsh
        run: |
          if ($env:GITHUB_ACTIONS -ne 'true' -or
              $env:RUNNER_ENVIRONMENT -ne 'github-hosted') {
            throw 'Protected audit integration must use an ephemeral GitHub-hosted Windows runner.'
          }
          $root = Join-Path $env:RUNNER_TEMP 'bkb-broker-integration'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          Expand-Archive -Path broker-integration/BitKeyBridge-win-x64.zip -DestinationPath $root -Force
          ./tests/windows/ProtectedAuditBrokerIntegration.ps1 `
            -Executable (Join-Path $root 'BitKeyBridge.exe') `
            -EphemeralHostedRunner

  release-signing-positive:
    # Ephemeral PKI tests are not an organization signing approval.
    # Sign COPIES of all 3 tested architectures with a temporary certificate
    # trusted only in CurrentUser on a disposable GitHub-hosted Windows runner.
    # Use 2022 deliberately: the 2025/VS2026 hosted image blocks indefinitely
    # in certutil CurrentUser Root enrollment even with a bounded child process.
    # Never upload the signed test binaries, certificate or private key.
    if: >-
      github.event_name == 'pull_request' &&
      (github.head_ref == 'feature/protected-audit-broker-20261014' || github.head_ref == 'integration/v0.30.2-audit-broker-updater-20261016' || github.head_ref == 'feature/v0.30.3-helpdesk-ux-20261016')
    needs: [build]
    runs-on: windows-2022
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout signing verification harness
        uses: actions/checkout@v7

      - name: Download verified x64 architecture
        uses: actions/download-artifact@v8
        with:
          name: BitKeyBridge-win-x64
          path: signing-integration/win-x64

      - name: Download verified x86 architecture
        uses: actions/download-artifact@v8
        with:
          name: BitKeyBridge-win-x86
          path: signing-integration/win-x86

      - name: Download verified ARM64 architecture
        uses: actions/download-artifact@v8
        with:
          name: BitKeyBridge-win-arm64
          path: signing-integration/win-arm64

      - name: Positive signed release and tamper rejection (ephemeral cert)
        shell: pwsh
        run: |
          if ($env:GITHUB_ACTIONS -ne 'true' -or
              $env:RUNNER_ENVIRONMENT -ne 'github-hosted') {
            throw 'Signature integration is allowed only on an ephemeral GitHub-hosted runner.'
          }
          ./tests/windows/ReleaseSigningPositiveIntegration.ps1 -ArtifactRoot signing-integration -EphemeralHostedRunner

  test-bundle:
    # One-click QA download only after EVERY required broker and signer test
    # passes. Never attach unsigned developer binaries to GitHub Releases.
    if: >-
      github.event_name == 'pull_request' &&
      (github.head_ref == 'feature/protected-audit-broker-20261014' || github.head_ref == 'integration/v0.30.2-audit-broker-updater-20261016' || github.head_ref == 'feature/v0.30.3-helpdesk-ux-20261016')
    needs: [build, laps-regression, audit-broker-integration, release-signing-positive]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout QA instructions
        uses: actions/checkout@v7

      - name: Download x64 test binary
        uses: actions/download-artifact@v8
        with:
          name: BitKeyBridge-win-x64
          path: test-bundle

      - name: Download x86 test binary
        uses: actions/download-artifact@v8
        with:
          name: BitKeyBridge-win-x86
          path: test-bundle

      - name: Download ARM64 test binary
        uses: actions/download-artifact@v8
        with:
          name: BitKeyBridge-win-arm64
          path: test-bundle

      - name: Generate checksums and isolated-QA instructions
        shell: bash
        run: |
          set -euo pipefail
          cp tests/windows/BitKeyBridge-DomainPreflight.cmd test-bundle/
          cd test-bundle
          for rid in win-x64 win-x86 win-arm64; do
            test -s "BitKeyBridge-${rid}.zip"
          done
          sha256sum BitKeyBridge-win-x64.zip BitKeyBridge-win-x86.zip BitKeyBridge-win-arm64.zip > SHA256SUMS.txt
          printf 'Git commit: %s\nVersion: 0.30.3-rc.1 (TEST ONLY)\n' "${GITHUB_SHA}" > BUILD-INFO.txt
          cat > README-TEST.txt <<'EOF'
          BitKeyBridge 0.30.3-rc.1 -- UNSIGNED QA TEST BUNDLE
          ==================================================
          This archive is NOT a production release and NOT organization-signed.
          Do not install on a domain controller or production Helpdesk workstation.
          Do not distribute through Intune, GPO or automatic updates.

          Files:
          - BitKeyBridge-win-x64.zip   Windows x64
          - BitKeyBridge-win-x86.zip   Windows x86
          - BitKeyBridge-win-arm64.zip Windows ARM64
          - SHA256SUMS.txt             SHA-256 checksums for all three ZIPs
          - BUILD-INFO.txt             Source commit and test version
          - BitKeyBridge-DomainPreflight.cmd  Optional read-only QA report

          Verify ZIP hashes against SHA256SUMS.txt. Extract ONLY the ZIP
          matching your Windows architecture on a disposable test workstation.
          From an ordinary, non-elevated CMD inside the EXE directory run:

              BitKeyBridge.exe --version
              BitKeyBridge.exe --startup-diagnostics --no-elevation
              BitKeyBridge.exe --self-test --no-elevation
              BitKeyBridge.exe --audit-broker-preflight --no-elevation

          Run the optional CMD report wrapper with the EXE absolute path:
              BitKeyBridge-DomainPreflight.cmd "C:\QA\BitKeyBridge.exe"

          To intentionally write one synthetic broker health event only:
              BitKeyBridge.exe --audit-broker-preflight --probe --no-elevation

          Real domain/Entra recovery, trusted signing, SIEM and rollback
          require separate controlled acceptance. See repository docs:
          docs/managed-domain-acceptance-0.30.0-rc.2.md

          DO NOT MERGE/PUBLISH WITHOUT MANAGED-DOMAIN ACCEPTANCE.
          EOF

      - name: Publish one-click unsigned QA bundle (Actions only)
        uses: actions/upload-artifact@v7
        with:
          name: BitKeyBridge-v0.30.3-rc.1-TEST-BUNDLE-UNSIGNED
          path: test-bundle/
          if-no-files-found: error
          retention-days: 90

  release:
    if: >-
      always() &&
      needs.build.result == 'success' &&
      needs.laps-regression.result == 'success' &&
      (
        (github.event_name == 'push' &&
         github.ref == 'refs/heads/release/v0.30.3' &&
         github.event.head_commit.message == 'Release v0.30.3' &&
         needs['audit-broker-integration'].result == 'success') ||
        (github.ref != 'refs/heads/release/v0.30.3' &&
         (startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'push' &&
           (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
           startsWith(github.event.head_commit.message, 'Release v')) ||
          (github.event_name == 'push' &&
           github.ref == 'refs/heads/improve/nonadmin-audit-ui-20261014' &&
           startsWith(github.event.head_commit.message, 'Publish RC v0.30.0-rc.1'))))
      )
    needs: [build, laps-regression, audit-broker-integration]
    runs-on: windows-latest
    # Least-privilege token; these scopes are never granted to PR builds.
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Resolve release tag
        id: release_meta
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $tag = "${{ github.ref_name }}"
          }
          else {
            [xml]$project = Get-Content src\BitKeyBridge\BitKeyBridge.csproj
            $nodes = @($project.SelectNodes('/Project/PropertyGroup/Version'))
            if ($nodes.Count -ne 1) { throw "Exactly one project version is required." }
            $version = [string]$nodes[0].InnerText.Trim()
            $tag = "v$version"
          }

          if ($tag -notmatch '^v\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Resolved release tag is invalid: $tag"
          }

          [xml]$project = Get-Content src\BitKeyBridge\BitKeyBridge.csproj
          $nodes = @($project.SelectNodes('/Project/PropertyGroup/Version'))
          if ($nodes.Count -ne 1) { throw "Exactly one project version is required." }
          $projectVersion = [string]$nodes[0].InnerText.Trim()
          if ($tag -ne "v$projectVersion") {
            throw "Release $tag does not match the tested project version $projectVersion."
          }
          if ("${{ github.ref }}" -eq "refs/heads/improve/nonadmin-audit-ui-20261014" -and
              $tag -ne "v0.30.0-rc.1") {
            throw "Staging branch is authorized only for v0.30.0-rc.1."
          }

          if ("${{ github.ref }}" -eq "refs/heads/release/v0.30.3" -and $tag -ne "v0.30.3") {
            throw "The dedicated release branch is authorized only for v0.30.3."
          }

          $exists = $false
          gh release view $tag --repo "${{ github.repository }}" *> $null
          $releaseViewExitCode = $LASTEXITCODE
          $global:LASTEXITCODE = 0

          if ($releaseViewExitCode -eq 0) {
            $exists = $true
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "exists=$($exists.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host "Release tag: $tag"
          Write-Host "Existing release: $exists"

      # A Git tag alone must never publish the unapproved audit-broker
      # preview, nor a later 0.30.x release carrying that sensitive feature.
      # Admins can intentionally approve after completing managed-machine
      # acceptance, configuring a real organizational signing identity and
      # reviewing the signed update/rollback chain.
      - name: Enforce protected audit release approval
        if: steps.release_meta.outputs.exists != 'true'
        shell: pwsh
        env:
          PROTECTED_AUDIT_APPROVED: ${{ vars.BITKEYBRIDGE_PROTECTED_AUDIT_APPROVED }}
          SIGNING_THUMBPRINT: ${{ vars.BITKEYBRIDGE_SIGNING_THUMBPRINT }}
        run: |
          $tag = "${{ steps.release_meta.outputs.tag }}"
          if ($tag -eq 'v0.30.3' -and
              "${{ github.ref }}" -eq 'refs/heads/release/v0.30.3') {
            Write-Host 'Owner-authorized unsigned release v0.30.3: no Authenticode signing.'
          }
          elseif ($tag.StartsWith("v0.30.", [StringComparison]::OrdinalIgnoreCase) -and
                  $tag -ne "v0.30.0-rc.1") {
            if ($env:PROTECTED_AUDIT_APPROVED -ne 'true') {
              throw "Protected audit broker release is NOT approved: complete real-domain AD/Entra acceptance and set BITKEYBRIDGE_PROTECTED_AUDIT_APPROVED=true intentionally."
            }
            if ([string]::IsNullOrWhiteSpace($env:SIGNING_THUMBPRINT)) {
              throw "Protected audit broker release requires the organizational Authenticode signing thumbprint. Unsigned automatic rollout is forbidden."
            }
          }

      - name: Download x64
        if: steps.release_meta.outputs.exists != 'true'
        uses: actions/download-artifact@v8
        with:
          name: BitKeyBridge-win-x64
          path: release

      - name: Download x86
        if: steps.release_meta.outputs.exists != 'true'
        uses: actions/download-artifact@v8
        with:
          name: BitKeyBridge-win-x86
          path: release

      - name: Download ARM64
        if: steps.release_meta.outputs.exists != 'true'
        uses: actions/download-artifact@v8
        with:
          name: BitKeyBridge-win-arm64
          path: release

      - name: Verify signatures and architectures before protected audit release
        if: >-
          steps.release_meta.outputs.exists != 'true' &&
          startsWith(steps.release_meta.outputs.tag, 'v0.30.') &&
          steps.release_meta.outputs.tag != 'v0.30.0-rc.1' &&
          github.ref != 'refs/heads/release/v0.30.3'
        shell: pwsh
        env:
          SIGNING_THUMBPRINT: ${{ vars.BITKEYBRIDGE_SIGNING_THUMBPRINT }}
        run: |
          $ErrorActionPreference = 'Stop'
          ./tests/windows/Verify-ReleaseSigning.ps1 `
            -ReleaseDirectory release `
            -Tag "${{ steps.release_meta.outputs.tag }}" `
            -ExpectedThumbprint $env:SIGNING_THUMBPRINT `
            -ExpectedSourceRevision "${{ github.sha }}" `
            -OutputPath release/BitKeyBridge.signatures.json
          if (-not (Test-Path release/BitKeyBridge.signatures.json)) {
            throw "Release signature verification evidence was not created."
          }

      - name: Generate CycloneDX SBOM
        if: steps.release_meta.outputs.exists != 'true'
        shell: pwsh
        run: |
          dotnet tool install --tool-path .tools CycloneDX --version 6.2.0
          $version = "${{ steps.release_meta.outputs.tag }}".TrimStart("v")
          .\.tools\dotnet-CycloneDX.exe src\BitKeyBridge\BitKeyBridge.csproj -o release -fn BitKeyBridge.cdx.json -F Json -spv 1.7 -sn BitKeyBridge -sv $version -st Application

      - name: Generate SHA256SUMS
        if: steps.release_meta.outputs.exists != 'true'
        shell: bash
        run: |
          cd release
          files=(BitKeyBridge-win-x64.zip BitKeyBridge-win-x86.zip BitKeyBridge-win-arm64.zip BitKeyBridge.cdx.json)
          if [[ -f BitKeyBridge.signatures.json ]]; then
            files+=(BitKeyBridge.signatures.json)
          fi
          sha256sum "${files[@]}" > SHA256SUMS.txt

      - name: Attest release provenance
        if: steps.release_meta.outputs.exists != 'true'
        uses: actions/attest@v4
        with:
          subject-path: |
            release/BitKeyBridge-win-x64.zip
            release/BitKeyBridge-win-x86.zip
            release/BitKeyBridge-win-arm64.zip
            release/BitKeyBridge.cdx.json
            release/SHA256SUMS.txt

      - name: Attest protected audit signature verification evidence
        if: >-
          steps.release_meta.outputs.exists != 'true' &&
          startsWith(steps.release_meta.outputs.tag, 'v0.30.') &&
          steps.release_meta.outputs.tag != 'v0.30.0-rc.1' &&
          github.ref != 'refs/heads/release/v0.30.3'
        uses: actions/attest@v4
        with:
          subject-path: release/BitKeyBridge.signatures.json

      - name: Attest release SBOM
        if: steps.release_meta.outputs.exists != 'true'
        uses: actions/attest@v4
        with:
          subject-path: |
            release/BitKeyBridge-win-x64.zip
            release/BitKeyBridge-win-x86.zip
            release/BitKeyBridge-win-arm64.zip
          sbom-path: release/BitKeyBridge.cdx.json

      - name: Smoke-test staged updater preferences (no network install)
        if: steps.release_meta.outputs.exists != 'true'
        shell: pwsh
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP "bitkeybridge-updater-smoke"
          Remove-Item $smokeRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $smokeRoot | Out-Null
          Expand-Archive -Path release\BitKeyBridge-win-x64.zip -DestinationPath $smokeRoot -Force
          $exe = Join-Path $smokeRoot "BitKeyBridge.exe"

          # Prepublication acceptance stays LOCAL: do not contact the public
          # Releases API or apply new executable files in CI.
          # Remote update/rollback needs a separate managed-machine test.

          $disableOutput = & $exe --update-checks-disable --no-elevation 2>&1 | Out-String
          $disableExit = $LASTEXITCODE
          Write-Host $disableOutput
          if ($disableExit -ne 0) {
            throw "--update-checks-disable failed with exit code $disableExit."
          }

          $disabledStatus = & $exe --update-checks-status --no-elevation 2>&1 | Out-String
          Write-Host $disabledStatus
          if ($disabledStatus -notmatch 'AutomaticChecks=False') {
            throw "Automatic update checks were not persisted as disabled."
          }

          $enableOutput = & $exe --update-checks-enable --no-elevation 2>&1 | Out-String
          $enableExit = $LASTEXITCODE
          Write-Host $enableOutput
          if ($enableExit -ne 0) {
            throw "--update-checks-enable failed with exit code $enableExit."
          }

          $enabledStatus = & $exe --update-checks-status --no-elevation 2>&1 | Out-String
          Write-Host $enabledStatus
          if ($enabledStatus -notmatch 'AutomaticChecks=True') {
            throw "Automatic update checks were not persisted as enabled."
          }

          $autoDisableOutput = & $exe --auto-update-disable --no-elevation 2>&1 | Out-String
          Write-Host $autoDisableOutput
          if ($LASTEXITCODE -ne 0) {
            throw "--auto-update-disable failed."
          }

          $autoDisabledStatus = & $exe --auto-update-status --no-elevation 2>&1 | Out-String
          Write-Host $autoDisabledStatus
          if ($autoDisabledStatus -notmatch 'AutomaticInstall=False') {
            throw "Automatic update installation was not persisted as disabled."
          }

          $autoEnableOutput = & $exe --auto-update-enable --no-elevation 2>&1 | Out-String
          Write-Host $autoEnableOutput
          if ($LASTEXITCODE -ne 0) {
            throw "--auto-update-enable failed."
          }

          $autoEnabledStatus = & $exe --auto-update-status --no-elevation 2>&1 | Out-String
          Write-Host $autoEnabledStatus
          if ($autoEnabledStatus -notmatch 'AutomaticInstall=True' -or
              $autoEnabledStatus -notmatch 'AutomaticChecks=True' -or
              $autoEnabledStatus -notmatch 'UnsignedConsent=True' -or
              $autoEnabledStatus -notmatch 'Unsigned opt-in') {
            throw "Automatic update installation was not persisted as enabled."
          }

          Write-Host 'Staged updater controls passed. No installation attempted.'

      - name: Create GitHub Release
        if: steps.release_meta.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.release_meta.outputs.tag }}"
          $assets = @(
            'release/BitKeyBridge-win-x64.zip',
            'release/BitKeyBridge-win-x86.zip',
            'release/BitKeyBridge-win-arm64.zip',
            'release/BitKeyBridge.cdx.json',
            'release/SHA256SUMS.txt'
          )
          if (Test-Path 'release/BitKeyBridge.signatures.json') {
            $assets += 'release/BitKeyBridge.signatures.json'
          }
          $args = @('release', 'create', $tag) + $assets + @(
            '--repo', '${{ github.repository }}',
            '--target', '${{ github.sha }}',
            '--generate-notes',
            '--title', "BitKeyBridge $tag"
          )
          if ($tag.Contains('-')) {
            # Mark RC/beta as prerelease. Never override GitHub stable Latest.
            $args += '--prerelease'
          }
          & gh @args
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release creation failed for $tag."
          }

