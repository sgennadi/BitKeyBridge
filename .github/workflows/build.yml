name: build

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: bitkeybridge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-x86, win-arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Verify CHANGELOG entry
        shell: pwsh
        run: |
          [xml]$project = Get-Content src\BitKeyBridge\BitKeyBridge.csproj
          $version = @($project.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          if (-not $version) { throw "Project version was not found." }
          $heading = "## $version"
          if (-not (Select-String -Path CHANGELOG.md -SimpleMatch $heading -Quiet)) {
            throw "CHANGELOG.md is missing required section: $heading"
          }

      - name: Restore
        shell: cmd
        run: dotnet restore src\BitKeyBridge\BitKeyBridge.csproj

      - name: Build
        shell: cmd
        run: dotnet build src\BitKeyBridge\BitKeyBridge.csproj -c Release --no-restore

      - name: Publish self-contained single file
        shell: cmd
        run: dotnet publish src\BitKeyBridge\BitKeyBridge.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=true -o artifacts\${{ matrix.rid }}

      - name: Offline self-test (supported Windows Server architecture)
        if: matrix.rid == 'win-x64'
        shell: cmd
        run: start /wait "" artifacts\${{ matrix.rid }}\BitKeyBridge.exe --self-test

      - name: Package architecture
        shell: cmd
        run: tar -a -c -f artifacts\BitKeyBridge-${{ matrix.rid }}.zip -C artifacts\${{ matrix.rid }} .

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: BitKeyBridge-${{ matrix.rid }}
          path: artifacts/BitKeyBridge-${{ matrix.rid }}.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release v'))
    needs: build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Resolve release tag
        id: release_meta
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $tag = "${{ github.ref_name }}"
          }
          else {
            [xml]$project = Get-Content src\BitKeyBridge\BitKeyBridge.csproj
            $version = @($project.Project.PropertyGroup.Version | Where-Object { $_ })[0]
            if (-not $version) { throw "Project version was not found." }
            $tag = "v$version"
          }

          if ($tag -notmatch '^v\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Resolved release tag is invalid: $tag"
          }

          $exists = $false
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            $exists = $true
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "exists=$($exists.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host "Release tag: $tag"
          Write-Host "Existing release: $exists"

      - name: Download x64
        if: steps.release_meta.outputs.exists != 'true'
        uses: actions/download-artifact@v8
        with:
          name: BitKeyBridge-win-x64
          path: release

      - name: Download x86
        if: steps.release_meta.outputs.exists != 'true'
        uses: actions/download-artifact@v8
        with:
          name: BitKeyBridge-win-x86
          path: release

      - name: Download ARM64
        if: steps.release_meta.outputs.exists != 'true'
        uses: actions/download-artifact@v8
        with:
          name: BitKeyBridge-win-arm64
          path: release

      - name: Generate CycloneDX SBOM
        if: steps.release_meta.outputs.exists != 'true'
        shell: pwsh
        run: |
          dotnet tool install --tool-path .tools CycloneDX --version 6.2.0
          $version = "${{ steps.release_meta.outputs.tag }}".TrimStart("v")
          .\.tools\dotnet-CycloneDX.exe src\BitKeyBridge\BitKeyBridge.csproj -o release -fn BitKeyBridge.cdx.json -F Json -spv 1.7 -sn BitKeyBridge -sv $version -st Application

      - name: Generate SHA256SUMS
        if: steps.release_meta.outputs.exists != 'true'
        shell: bash
        run: |
          cd release
          sha256sum BitKeyBridge-win-x64.zip BitKeyBridge-win-x86.zip BitKeyBridge-win-arm64.zip BitKeyBridge.cdx.json > SHA256SUMS.txt

      - name: Attest release provenance
        if: steps.release_meta.outputs.exists != 'true'
        uses: actions/attest@v4
        with:
          subject-path: |
            release/BitKeyBridge-win-x64.zip
            release/BitKeyBridge-win-x86.zip
            release/BitKeyBridge-win-arm64.zip
            release/BitKeyBridge.cdx.json
            release/SHA256SUMS.txt

      - name: Attest release SBOM
        if: steps.release_meta.outputs.exists != 'true'
        uses: actions/attest@v4
        with:
          subject-path: |
            release/BitKeyBridge-win-x64.zip
            release/BitKeyBridge-win-x86.zip
            release/BitKeyBridge-win-arm64.zip
          sbom-path: release/BitKeyBridge.cdx.json

      - name: Create GitHub Release
        if: steps.release_meta.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.release_meta.outputs.tag }}"
          gh release create $tag release/BitKeyBridge-win-x64.zip release/BitKeyBridge-win-x86.zip release/BitKeyBridge-win-arm64.zip release/BitKeyBridge.cdx.json release/SHA256SUMS.txt --repo "${{ github.repository }}" --target "${{ github.sha }}" --generate-notes --title "BitKeyBridge $tag"
