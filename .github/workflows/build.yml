         github.ref != 'refs/heads/release/v0.32.1' &&
         github.ref != 'refs/heads/release/v0.32.2' &&
         github.ref != 'refs/heads/release/v0.32.3' &&
         github.ref != 'refs/heads/release/v0.32.4' &&
         github.ref != 'refs/heads/release/v0.32.5' &&
         github.ref != 'refs/heads/release/v0.33.0' &&
         github.ref != 'refs/heads/release/v0.33.1' &&
         github.ref != 'refs/tags/v0.33.0' &&
         github.ref != 'refs/tags/v0.33.1' &&
         (startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'push' &&
           (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
           startsWith(github.event.head_commit.message, 'Release v')) ||
          (github.event_name == 'push' &&
           github.ref == 'refs/heads/improve/nonadmin-audit-ui-20261014' &&
           startsWith(github.event.head_commit.message, 'Publish RC v0.30.0-rc.1'))))
      )
    needs: [build, laps-regression, audit-broker-integration, legacy-upgrade-regression, codeql-stable-release]
    runs-on: windows-latest
    # Least-privilege token; these scopes are never granted to PR builds.
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Resolve release tag
        id: release_meta
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $tag = "${{ github.ref_name }}"
          }
          else {
            [xml]$project = Get-Content src\BitKeyBridge\BitKeyBridge.csproj
            $nodes = @($project.SelectNodes('/Project/PropertyGroup/Version'))
            if ($nodes.Count -ne 1) { throw "Exactly one project version is required." }
            $version = [string]$nodes[0].InnerText.Trim()
            $tag = "v$version"
          }

          if ($tag -notmatch '^v\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Resolved release tag is invalid: $tag"
          }

          [xml]$project = Get-Content src\BitKeyBridge\BitKeyBridge.csproj
          $nodes = @($project.SelectNodes('/Project/PropertyGroup/Version'))
          if ($nodes.Count -ne 1) { throw "Exactly one project version is required." }
          $projectVersion = [string]$nodes[0].InnerText.Trim()
          if ($tag -ne "v$projectVersion") {
            throw "Release $tag does not match the tested project version $projectVersion."
          }
          if ("${{ github.ref }}" -eq "refs/heads/improve/nonadmin-audit-ui-20261014" -and
              $tag -ne "v0.30.0-rc.1") {
            throw "Staging branch is authorized only for v0.30.0-rc.1."
          }

          if ("${{ github.ref }}" -eq "refs/heads/release/v0.30.3" -and $tag -ne "v0.30.3") {
            throw "The dedicated release branch is authorized only for v0.30.3."
          }
          if ("${{ github.ref }}" -eq "refs/heads/release/v0.30.4" -and $tag -ne "v0.30.4") {
            throw "The dedicated release branch is authorized only for v0.30.4."
          }
          if ("${{ github.ref }}" -eq "refs/heads/release/v0.30.5" -and $tag -ne "v0.30.5") {
            throw "The dedicated release branch is authorized only for v0.30.5."
          }

          if ("${{ github.ref }}" -eq "refs/heads/release/v0.32.0" -and $tag -ne "v0.32.0") {
            throw "The dedicated release branch is authorized only for v0.32.0."
          }
          if ("${{ github.ref }}" -eq "refs/heads/release/v0.32.1" -and $tag -ne "v0.32.1") {
            throw "The dedicated release branch is authorized only for v0.32.1."
          }
          if ("${{ github.ref }}" -eq "refs/heads/release/v0.32.2" -and $tag -ne "v0.32.2") {
            throw "The dedicated release branch is authorized only for v0.32.2."
          }
          if ("${{ github.ref }}" -eq "refs/heads/release/v0.32.3" -and $tag -ne "v0.32.3") {
            throw "The dedicated release branch is authorized only for v0.32.3."
          }
          if ("${{ github.ref }}" -eq "refs/heads/release/v0.32.4" -and $tag -ne "v0.32.4") {
            throw "The dedicated release branch is authorized only for v0.32.4."
          }
          if ("${{ github.ref }}" -eq "refs/heads/release/v0.32.5" -and $tag -ne "v0.32.5") {
            throw "The dedicated release branch is authorized only for v0.32.5."
          }
          if ("${{ github.ref }}" -eq "refs/heads/release/v0.33.0" -and $tag -ne "v0.33.0") {
            throw "The dedicated release branch is authorized only for v0.33.0."
          }
          if ("${{ github.ref }}" -eq "refs/heads/release/v0.33.1" -and $tag -ne "v0.33.1") {
            throw "The dedicated release branch is authorized only for v0.33.1."
          }

          $exists = $false
          gh release view $tag --repo "${{ github.repository }}" *> $null
          $releaseViewExitCode = $LASTEXITCODE
          $global:LASTEXITCODE = 0

          if ($releaseViewExitCode -eq 0) {
            $exists = $true
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "exists=$($exists.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host "Release tag: $tag"
          Write-Host "Existing release: $exists"

      # A Git tag alone must never publish the unapproved audit-broker
      # preview, nor a later 0.30.x release carrying that sensitive feature.
      # Admins can intentionally approve after completing managed-machine
      # acceptance, configuring a real organizational signing identity and
      # reviewing the signed update/rollback chain.
      - name: Enforce protected audit release approval
        if: steps.release_meta.outputs.exists != 'true'
        shell: pwsh
        env:
          PROTECTED_AUDIT_APPROVED: ${{ vars.BITKEYBRIDGE_PROTECTED_AUDIT_APPROVED }}
          SIGNING_THUMBPRINT: ${{ vars.BITKEYBRIDGE_SIGNING_THUMBPRINT }}
        run: |
          $tag = "${{ steps.release_meta.outputs.tag }}"
          if (($tag -eq 'v0.30.3' -and
               "${{ github.ref }}" -eq 'refs/heads/release/v0.30.3') -or
              ($tag -eq 'v0.30.4' -and
               "${{ github.ref }}" -eq 'refs/heads/release/v0.30.4') -or
              ($tag -eq 'v0.30.5' -and
               "${{ github.ref }}" -eq 'refs/heads/release/v0.30.5')) {
            Write-Host "Owner-authorized unsigned release ${tag}: no Authenticode signing."
          }
          elseif ($tag -eq 'v0.32.0' -and
                  "${{ github.ref }}" -eq 'refs/heads/release/v0.32.0') {
            if (-not (Test-Path 'docs/release-authorization-v0.32.0.md')) {
              throw 'Stable 0.32.0 publication authorization document is missing.'
            }
            Write-Host 'Owner-authorized UNSIGNED v0.32.0 Stable; no fleet deployment.'
          }
          elseif ($tag -eq 'v0.32.1' -and
                  "${{ github.ref }}" -eq 'refs/heads/release/v0.32.1') {
            if (-not (Test-Path 'docs/release-authorization-v0.32.1.md')) {
              throw 'v0.32.1 Stable publication authorization document is missing.'
            }
            Write-Host 'Owner-authorized UNSIGNED v0.32.1 Stable: managed canary only with explicit consent.'
          }
          elseif ($tag -eq 'v0.32.2' -and
                  "${{ github.ref }}" -eq 'refs/heads/release/v0.32.2') {
            if (-not (Test-Path 'docs/release-authorization-v0.32.2.md')) {
              throw 'v0.32.2 Stable publication authorization document is missing.'
            }
            Write-Host 'Owner-authorized UNSIGNED v0.32.2 Stable: managed canary only with explicit consent.'
          }
          elseif ($tag -eq 'v0.32.3' -and
                  "${{ github.ref }}" -eq 'refs/heads/release/v0.32.3') {
            if (-not (Test-Path 'docs/release-authorization-v0.32.3.md')) {
              throw 'v0.32.3 Stable publication authorization document is missing.'
            }
            Write-Host 'Owner-authorized UNSIGNED v0.32.3 Stable: managed canary only with explicit consent.'
          }
          elseif ($tag -eq 'v0.32.4' -and
                  "${{ github.ref }}" -eq 'refs/heads/release/v0.32.4') {
            if (-not (Test-Path 'docs/release-authorization-v0.32.4.md')) {
              throw 'v0.32.4 Stable publication authorization document is missing.'
            }
            Write-Host 'Owner-authorized UNSIGNED v0.32.4 Stable: managed canary only with explicit consent.'
          }
          elseif ($tag -eq 'v0.32.5' -and
                  "${{ github.ref }}" -eq 'refs/heads/release/v0.32.5') {
            if (-not (Test-Path 'docs/release-authorization-v0.32.5.md')) {
              throw 'v0.32.5 Stable publication authorization document is missing.'
            }
            Write-Host 'Owner-authorized UNSIGNED v0.32.5 Stable: managed canary only with explicit consent.'
          }
          elseif ($tag -eq 'v0.33.0' -and
                  "${{ github.ref }}" -eq 'refs/heads/release/v0.33.0') {
            if (-not (Test-Path 'docs/release-authorization-v0.33.0.md')) {
              throw 'v0.33.0 Stable publication authorization document is missing.'
            }
            if (-not (Test-Path 'docs/release-notes-v0.33.0.md')) {
              throw 'v0.33.0 Stable release notes are missing.'
            }
            Write-Host 'Owner-requested UNSIGNED v0.33.0 Stable: exact-source gates required, no fleet authorization.'
          }
          elseif ($tag -eq 'v0.33.1' -and
                  "${{ github.ref }}" -eq 'refs/heads/release/v0.33.1') {
            if (-not (Test-Path 'docs/release-authorization-v0.33.1.md')) {
              throw 'v0.33.1 Stable publication authorization document is missing.'
            }
            if (-not (Test-Path 'docs/release-notes-v0.33.1.md')) {
              throw 'v0.33.1 Stable release notes are missing.'
            }
            Write-Host 'UNSIGNED v0.33.1 Stable: on-SHA security gates mandatory; managed fleet deployment NOT approved.'
          }
          elseif ($tag.StartsWith("v0.30.", [StringComparison]::OrdinalIgnoreCase) -and
                  $tag -ne "v0.30.0-rc.1") {
            if ($env:PROTECTED_AUDIT_APPROVED -ne 'true') {
              throw "Protected audit broker release is NOT approved: complete real-domain AD/Entra acceptance and set BITKEYBRIDGE_PROTECTED_AUDIT_APPROVED=true intentionally."
            }
            if ([string]::IsNullOrWhiteSpace($env:SIGNING_THUMBPRINT)) {
              throw "Protected audit broker release requires the organizational Authenticode signing thumbprint. Unsigned automatic rollout is forbidden."
            }
          }

      - name: Download x64
        if: steps.release_meta.outputs.exists != 'true'
        uses: actions/download-artifact@v8
        with:
          name: BitKeyBridge-win-x64
          path: release

      - name: Download x86
        if: steps.release_meta.outputs.exists != 'true'
        uses: actions/download-artifact@v8
        with:
          name: BitKeyBridge-win-x86
          path: release

      - name: Download ARM64
        if: steps.release_meta.outputs.exists != 'true'
        uses: actions/download-artifact@v8
        with:
          name: BitKeyBridge-win-arm64
          path: release

      - name: Verify signatures and architectures before protected audit release
        if: >-
          steps.release_meta.outputs.exists != 'true' &&
          startsWith(steps.release_meta.outputs.tag, 'v0.30.') &&
          steps.release_meta.outputs.tag != 'v0.30.0-rc.1' &&
          github.ref != 'refs/heads/release/v0.30.3' &&
          github.ref != 'refs/heads/release/v0.30.4' &&
          github.ref != 'refs/heads/release/v0.30.5'
        shell: pwsh
        env:
          SIGNING_THUMBPRINT: ${{ vars.BITKEYBRIDGE_SIGNING_THUMBPRINT }}
        run: |
          $ErrorActionPreference = 'Stop'
          ./tests/windows/Verify-ReleaseSigning.ps1 `
            -ReleaseDirectory release `
            -Tag "${{ steps.release_meta.outputs.tag }}" `
            -ExpectedThumbprint $env:SIGNING_THUMBPRINT `
            -ExpectedSourceRevision "${{ github.sha }}" `
            -OutputPath release/BitKeyBridge.signatures.json
          if (-not (Test-Path release/BitKeyBridge.signatures.json)) {
            throw "Release signature verification evidence was not created."
          }

      - name: Generate CycloneDX SBOM
        if: steps.release_meta.outputs.exists != 'true'
        shell: pwsh
        run: |
          dotnet tool install --tool-path .tools CycloneDX --version 6.2.0
          $version = "${{ steps.release_meta.outputs.tag }}".TrimStart("v")
          .\.tools\dotnet-CycloneDX.exe src\BitKeyBridge\BitKeyBridge.csproj -o release -fn BitKeyBridge.cdx.json -F Json -spv 1.7 -sn BitKeyBridge -sv $version -st Application

      - name: Include build info and technician diagnostics
        if: steps.release_meta.outputs.exists != 'true'
        shell: pwsh
        run: |
          Copy-Item tests/windows/BitKeyBridge-DomainPreflight.cmd release/BitKeyBridge-DomainPreflight.cmd
          "Version: ${{ steps.release_meta.outputs.tag }}" | Set-Content release/BUILD-INFO.txt
          "Git commit: ${{ github.sha }}" | Add-Content release/BUILD-INFO.txt
          "Authenticode: UNSIGNED" | Add-Content release/BUILD-INFO.txt

      - name: Prepare stable unsigned release notes
        if: >-
          steps.release_meta.outputs.exists != 'true' &&
          (github.ref == 'refs/heads/release/v0.30.3' ||
           github.ref == 'refs/heads/release/v0.30.4' ||
           github.ref == 'refs/heads/release/v0.30.5' ||
           github.ref == 'refs/heads/release/v0.32.0' ||
           github.ref == 'refs/heads/release/v0.32.1' ||
           github.ref == 'refs/heads/release/v0.32.2' ||
           github.ref == 'refs/heads/release/v0.32.3' ||
           github.ref == 'refs/heads/release/v0.32.4' ||
           github.ref == 'refs/heads/release/v0.32.5' ||
           github.ref == 'refs/heads/release/v0.33.0' ||
           github.ref == 'refs/heads/release/v0.33.1')
        shell: pwsh
        run: |
          $tag = "${{ steps.release_meta.outputs.tag }}"
          if ($tag -eq 'v0.33.1') {
            Copy-Item docs/release-notes-v0.33.1.md release/RELEASE-NOTES.md
          }
          elseif ($tag -eq 'v0.33.0') {
            Copy-Item docs/release-notes-v0.33.0.md release/RELEASE-NOTES.md
          }
          elseif ($tag -eq 'v0.32.5') {
            Copy-Item docs/release-notes-v0.32.5.md release/RELEASE-NOTES.md
          }
          elseif ($tag -eq 'v0.32.4') {
            Copy-Item docs/release-notes-v0.32.4.md release/RELEASE-NOTES.md
          }
          elseif ($tag -eq 'v0.32.3') {
            Copy-Item docs/release-notes-v0.32.3.md release/RELEASE-NOTES.md
          }
          elseif ($tag -eq 'v0.32.2') {
            Copy-Item docs/release-notes-v0.32.2.md release/RELEASE-NOTES.md
          }
          elseif ($tag -eq 'v0.32.1') {
            Copy-Item docs/release-notes-v0.32.1.md release/RELEASE-NOTES.md
          }
          elseif ($tag -eq 'v0.32.0') {
            Copy-Item docs/release-notes-v0.32.0.md release/RELEASE-NOTES.md
          }
          elseif ($tag -eq 'v0.30.5') {
            Copy-Item docs/unsigned-auto-update-0.30.5.md release/RELEASE-NOTES.md
          }
          elseif ($tag -eq 'v0.30.4') {
            Copy-Item docs/unsigned-auto-update-0.30.4.md release/RELEASE-NOTES.md
          }
          else {
            Copy-Item docs/unsigned-auto-update-0.30.3.md release/RELEASE-NOTES.md
          }

      - name: Generate v0.32.1 canary installer pinned to actual built ZIPs
        if: >-
          steps.release_meta.outputs.exists != 'true' &&
          github.ref == 'refs/heads/release/v0.32.1'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $template = Get-Content 'deployment/intune/Install-BitKeyBridgeStable.ps1' -Raw -Encoding UTF8
          $sourceSha = '09cb98c7983de3a8339bf4802918bbdb378a1be8'
          if (($template.Split(@($sourceSha), [StringSplitOptions]::None).Length - 1) -ne 1) {
            throw 'Pinned installer source SHA placeholder is missing or duplicated.'
          }
          $template = $template.Replace($sourceSha, '${{ github.sha }}')
          $template = $template.Replace('v0.32.0', 'v0.32.1')
          $template = $template.Replace('0.32.0', '0.32.1')

          $oldPins = @{
            'win-x64' = '1cecd4940e50b26f9c09823a9372a04f9aa3c01780702b66d6f615aa81da7a55'
            'win-x86' = '97b0d8f3737ae22c99fb41567783ff390a17f3fdddd67da1918130e4e4d5cbcd'
            'win-arm64' = '8a1db7457d4765be1622de028aaed78916f4bd4f4fbb35334a4183183e1585ed'
          }
          foreach ($rid in @('win-x64', 'win-x86', 'win-arm64')) {
            $path = "release/BitKeyBridge-$rid.zip"
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing verified architecture release package: $rid"
            }
            $old = $oldPins[$rid]
            if (($template.Split(@($old), [StringSplitOptions]::None).Length - 1) -ne 1) {
              throw "Pinned installer template hash missing or duplicated: $rid"
            }
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            $template = $template.Replace($old, $hash)
          }
          if ($template.Contains('0.32.0') -or $template.Contains($sourceSha) -or
              $template.Contains('1cecd4940e50b26f') -or
              $template.Contains('97b0d8f3737ae22c') -or
              $template.Contains('8a1db7457d4765be')) {
            throw 'Generated v0.32.1 installer contains stale release information.'
          }
          $result = Join-Path $PWD 'release/Install-BitKeyBridge-v0.32.1.ps1'
          [IO.File]::WriteAllText($result, $template, [Text.UTF8Encoding]::new($false))
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            $result, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            throw "Installer PowerShell syntax is invalid: $($errors[0].Message)"
          }
          Write-Host 'Generated exact-source, exact-hash v0.32.1 installer.'

      - name: Verify v0.32.1 canary installer and reject tampered ZIP
        if: >-
          steps.release_meta.outputs.exists != 'true' &&
          github.ref == 'refs/heads/release/v0.32.1'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Resolve-Path 'release/Install-BitKeyBridge-v0.32.1.ps1').Path
          foreach ($rid in @('win-x64', 'win-x86', 'win-arm64')) {
            $file = (Resolve-Path "release/BitKeyBridge-$rid.zip").Path
            & powershell.exe -NoProfile -NonInteractive -File $installer -Mode Validate -Architecture $rid -PackagePath $file
            if ($LASTEXITCODE -ne 0) {
              throw "PowerShell 5.1 validation failed for $rid."
            }
          }
          $tampered = Join-Path $env:RUNNER_TEMP 'BitKeyBridge-win-x64-tampered.zip'
          Copy-Item 'release/BitKeyBridge-win-x64.zip' $tampered -Force
          [IO.File]::AppendAllText($tampered, 'tampered')
          & powershell.exe -NoProfile -NonInteractive -File $installer -Mode Validate -Architecture win-x64 -PackagePath $tampered 2>&1 | Out-String | Write-Host
          $tamperExit = $LASTEXITCODE
          Remove-Item -LiteralPath $tampered -Force
          if ($tamperExit -eq 0) {
            throw 'SECURITY: Tampered release ZIP was accepted by the canary installer.'
          }
          # The rejection is expected. A pwsh Actions step otherwise exits
          # nonzero due to the LASTEXITCODE left by powershell.exe even when
          # its explicitly asserted failure was correctly handled.
          $global:LASTEXITCODE = 0
          Write-Host 'All three architecture hashes and negative tamper test passed. No installation performed.'

      - name: Generate v0.32.2 canary installer pinned to actual built ZIPs
        if: >-
          steps.release_meta.outputs.exists != 'true' &&
          github.ref == 'refs/heads/release/v0.32.2'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $template = Get-Content 'deployment/intune/Install-BitKeyBridgeStable.ps1' -Raw -Encoding UTF8
          $sourceSha = '09cb98c7983de3a8339bf4802918bbdb378a1be8'
          if (($template.Split(@($sourceSha), [StringSplitOptions]::None).Length - 1) -ne 1) {
            throw 'Pinned installer source SHA placeholder is missing or duplicated.'
          }
          $template = $template.Replace($sourceSha, '${{ github.sha }}')
          $template = $template.Replace('v0.32.0', 'v0.32.2')
          $template = $template.Replace('0.32.0', '0.32.2')

          $oldPins = @{
            'win-x64' = '1cecd4940e50b26f9c09823a9372a04f9aa3c01780702b66d6f615aa81da7a55'
            'win-x86' = '97b0d8f3737ae22c99fb41567783ff390a17f3fdddd67da1918130e4e4d5cbcd'
            'win-arm64' = '8a1db7457d4765be1622de028aaed78916f4bd4f4fbb35334a4183183e1585ed'
          }
          foreach ($rid in @('win-x64', 'win-x86', 'win-arm64')) {
            $path = "release/BitKeyBridge-$rid.zip"
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing verified architecture release package: $rid"
            }
            $old = $oldPins[$rid]
            if (($template.Split(@($old), [StringSplitOptions]::None).Length - 1) -ne 1) {
              throw "Pinned installer template hash missing or duplicated: $rid"
            }
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            $template = $template.Replace($old, $hash)
          }
          if ($template.Contains('0.32.0') -or $template.Contains($sourceSha) -or
              $template.Contains('1cecd4940e50b26f') -or
              $template.Contains('97b0d8f3737ae22c') -or
              $template.Contains('8a1db7457d4765be')) {
            throw 'Generated v0.32.2 installer contains stale release information.'
          }
          $result = Join-Path $PWD 'release/Install-BitKeyBridge-v0.32.2.ps1'
          [IO.File]::WriteAllText($result, $template, [Text.UTF8Encoding]::new($false))
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            $result, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            throw "Installer PowerShell syntax is invalid: $($errors[0].Message)"
          }
          Write-Host 'Generated exact-source, exact-hash v0.32.2 installer.'

      - name: Verify v0.32.2 canary installer and reject tampered ZIP
        if: >-
          steps.release_meta.outputs.exists != 'true' &&
          github.ref == 'refs/heads/release/v0.32.2'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Resolve-Path 'release/Install-BitKeyBridge-v0.32.2.ps1').Path
          foreach ($rid in @('win-x64', 'win-x86', 'win-arm64')) {
            $file = (Resolve-Path "release/BitKeyBridge-$rid.zip").Path
            & powershell.exe -NoProfile -NonInteractive -File $installer -Mode Validate -Architecture $rid -PackagePath $file
            if ($LASTEXITCODE -ne 0) {
              throw "PowerShell 5.1 validation failed for $rid."
            }
          }
          $tampered = Join-Path $env:RUNNER_TEMP 'BitKeyBridge-win-x64-tampered.zip'
          Copy-Item 'release/BitKeyBridge-win-x64.zip' $tampered -Force
          [IO.File]::AppendAllText($tampered, 'tampered')
          & powershell.exe -NoProfile -NonInteractive -File $installer -Mode Validate -Architecture win-x64 -PackagePath $tampered 2>&1 | Out-String | Write-Host
          $tamperExit = $LASTEXITCODE
          Remove-Item -LiteralPath $tampered -Force
          if ($tamperExit -eq 0) {
            throw 'SECURITY: Tampered release ZIP was accepted by the canary installer.'
          }
          # The rejection is expected. A pwsh Actions step otherwise exits
          # nonzero due to the LASTEXITCODE left by powershell.exe even when
