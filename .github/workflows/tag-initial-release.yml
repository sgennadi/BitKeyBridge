name: tag-initial-release

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/tag-initial-release.yml"

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create v0.1.0 tag
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin refs/tags/v0.1.0 >/dev/null 2>&1; then
            echo "v0.1.0 already exists"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.1.0 -m "BitKeyBridge v0.1.0"
          git push origin v0.1.0
