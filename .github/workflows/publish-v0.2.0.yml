name: publish-v0.2.0

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/publish-v0.2.0.yml"

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified v0.2.0 artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release
          gh run download 35493204444 --repo "$GITHUB_REPOSITORY" --name BitKeyBridge-win-x64 --dir release
          gh run download 35493204444 --repo "$GITHUB_REPOSITORY" --name BitKeyBridge-win-x86 --dir release
          gh run download 35493204444 --repo "$GITHUB_REPOSITORY" --name BitKeyBridge-win-arm64 --dir release
          ls -lah release

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum BitKeyBridge-win-x64.zip BitKeyBridge-win-x86.zip BitKeyBridge-win-arm64.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish v0.2.0
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v0.2.0 \
            release/BitKeyBridge-win-x64.zip \
            release/BitKeyBridge-win-x86.zip \
            release/BitKeyBridge-win-arm64.zip \
            release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target ad437c646578e290485ffe01ff7680cd7eb6157f \
            --title "BitKeyBridge v0.2.0" \
            --generate-notes
