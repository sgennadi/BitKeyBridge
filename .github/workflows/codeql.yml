name: codeql

on:
  push:
    branches: [ "main", "master", "release/v0.30.3", "release/v0.30.4", "release/v0.32.0", "release/v0.32.1", "release/v0.32.2", "release/v0.32.3" ]
  pull_request:
    # Analyze feature PRs targeting integration/staging branches as well as
    # main; security checks must not silently disappear on stacked PRs.
  schedule:
    - cron: "27 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  security-events: write

concurrency:
  # Keep CodeQL bound to the exact commit for the same out-of-order PR event
  # protection used by the build workflow.
  group: bitkeybridge-codeql-${{ github.sha }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze C#
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual

      - name: Restore
        shell: cmd
        run: dotnet restore src\BitKeyBridge\BitKeyBridge.csproj

      - name: Build
        shell: cmd
        run: dotnet build src\BitKeyBridge\BitKeyBridge.csproj -c Release --no-restore

      - name: Analyze
        uses: github/codeql-action/analyze@v4
