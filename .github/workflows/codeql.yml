name: codeql

on:
  push:
    branches: [ "main", "master", "release/v0.30.3", "release/v0.30.4", "release/v0.32.0", "release/v0.32.1", "release/v0.32.2", "release/v0.32.3", "release/v0.32.4", "release/v0.32.5" ]
  pull_request:
    # Analyze feature PRs targeting integration/staging branches as well as
    # main; security checks must not silently disappear on stacked PRs.
  schedule:
    - cron: "27 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  security-events: write

concurrency:
  # Keep CodeQL bound to the exact commit for the same out-of-order PR event
  # protection used by the build workflow.
  group: bitkeybridge-codeql-${{ github.sha }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze C#
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # windows-latest VS2026 runners already carry SDK 10.0.402.
      # setup-dotnet 10.0.x may try downloading 10.0.403 from a broken
      # mirror (HTTP 409). Still fall back when the runner has no SDK 10.
      - name: Detect preinstalled .NET 10 SDK
        id: sdk_check
        shell: pwsh
        run: |
          $sdks = @()
          if (Get-Command dotnet -ErrorAction SilentlyContinue) {
            $sdks = @(dotnet --list-sdks)
          }
          $available = @($sdks | Where-Object {
            $_ -match '^10\.0\.\d+\s+\['
          }).Count -gt 0
          "available=$($available.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if ($available) { Write-Host 'Using preinstalled .NET 10 SDK for CodeQL.' }
          else { Write-Host '.NET 10 not preinstalled; using setup-dotnet.' }

      - name: Setup .NET 10
        if: steps.sdk_check.outputs.available != 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual

      - name: Restore
        shell: cmd
        run: dotnet restore src\BitKeyBridge\BitKeyBridge.csproj

      - name: Build
        shell: cmd
        run: dotnet build src\BitKeyBridge\BitKeyBridge.csproj -c Release --no-restore

      - name: Analyze
        uses: github/codeql-action/analyze@v4
