name: tag-v0.2.1

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/tag-v0.2.1.yml"

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Create verified v0.2.1 tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.2.1" >/dev/null 2>&1; then
            echo "Tag v0.2.1 already exists."
            exit 0
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/v0.2.1" \
            -f sha="9cc2b83aebd25bf3a9ebbac2d76b6957458984f4"
