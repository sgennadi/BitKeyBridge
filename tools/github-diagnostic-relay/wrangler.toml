name = "bitkeybridge-diagnostic-relay"
main = "index.mjs"
compatibility_date = "2026-11-05"
workers_dev = true

# Secrets are configured AFTER creating the Worker:
# npx wrangler secret put GITHUB_TOKEN
# npx wrangler secret put INGEST_TOKEN
# NEVER place secrets or a GitHub token in this file.
# Before production enable Cloudflare WAF per-IP rate limiting,
# protected-origin access and monitoring. The ingest token provides
# a shared-upload-key check, NOT cryptographic client identity.
